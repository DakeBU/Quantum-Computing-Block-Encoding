name: Focused casebook pedagogy gate

on:
  push:
    branches:
      - agent/pedagogy-casebook
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-casebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile and test casebook enrichment
        run: |
          python3 -m py_compile website/scripts/enrich_casebook.py website/scripts/test_casebook_enrichment.py
          python3 -m unittest website.scripts.test_casebook_enrichment
          git diff --check
