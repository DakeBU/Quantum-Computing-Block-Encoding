name: Reversible parallel schedule

on:
  push:
    branches:
      - "work/reversible-parallel-schedule-*"
    paths:
      - "QuantumBlockEncoding/ReversibleSchedule.lean"
      - "QuantumBlockEncoding/ParallelReversibleSchedule.lean"
      - ".github/workflows/reversible-parallel-schedule.yml"
  pull_request:
    paths:
      - "QuantumBlockEncoding/ReversibleSchedule.lean"
      - "QuantumBlockEncoding/ParallelReversibleSchedule.lean"
      - ".github/workflows/reversible-parallel-schedule.yml"
  workflow_dispatch:

concurrency:
  group: reversible-parallel-schedule-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parallel-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile parallel schedule certificate
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.ParallelReversibleSchedule
