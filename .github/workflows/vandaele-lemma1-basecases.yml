name: Vandaele Lemma 1 primitive base cases

on:
  push:
    branches:
      - "work/vandaele-lemma1-basecases-*"
    paths:
      - "QuantumBlockEncoding/ReversibleSchedule.lean"
      - "QuantumBlockEncoding/VandaeleLemma1Contract.lean"
      - "QuantumBlockEncoding/VandaeleLemma1ProgramFamily.lean"
      - "QuantumBlockEncoding/VandaeleLemma1PrimitiveBaseCases.lean"
      - ".github/workflows/vandaele-lemma1-basecases.yml"
  pull_request:
    paths:
      - "QuantumBlockEncoding/ReversibleSchedule.lean"
      - "QuantumBlockEncoding/VandaeleLemma1Contract.lean"
      - "QuantumBlockEncoding/VandaeleLemma1ProgramFamily.lean"
      - "QuantumBlockEncoding/VandaeleLemma1PrimitiveBaseCases.lean"
      - ".github/workflows/vandaele-lemma1-basecases.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-lemma1-basecases-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  primitive-base-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile semantic bridge and primitive base cases
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleLemma1PrimitiveBaseCases
