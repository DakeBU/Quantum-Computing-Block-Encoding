name: Repository admission and single-main invariant

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-admission.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: repository-admission-v2
  cancel-in-progress: false

jobs:
  admit-deploy-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Squash latest State Preparation and website tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git merge --squash -X theirs origin/agent/papers-state-prep

          # Main owns permanent workflows. Candidate-only CI/debug workflows are
          # deliberately excluded from the admitted source tree.
          mapfile -t changed_workflows < <(git diff --cached --name-only -- .github/workflows)
          for path in "${changed_workflows[@]}"; do
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              git restore --source=HEAD --staged --worktree -- "$path"
            else
              git rm -f --cached --ignore-unmatch -- "$path"
              rm -f -- "$path"
            fi
          done
          git diff --check

      - name: Canonicalize State Preparation proof leaves
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          entry = Path('QuantumBlockEncoding/StatePreparationBenchmarks.lean')
          if not entry.is_file():
              raise SystemExit('StatePreparationBenchmarks.lean missing after squash')
          text = entry.read_text(encoding='utf-8')
          text = text.replace('StatePreparationPaperRoutesFinal', 'StatePreparationPaperRoutes')
          entry.write_text(text, encoding='utf-8')
          Path('QuantumBlockEncoding/StatePreparationPaperRoutesFinal.lean').unlink(missing_ok=True)

          umbrella = Path('QuantumBlockEncoding.lean')
          text = umbrella.read_text(encoding='utf-8')
          if 'import QuantumBlockEncoding.StatePreparationBenchmarks' not in text:
              umbrella.write_text(text.rstrip() + '\nimport QuantumBlockEncoding.StatePreparationBenchmarks\n', encoding='utf-8')

          paper = Path('QuantumBlockEncoding/StatePreparationPaperRoutes.lean')
          text = paper.read_text(encoding='utf-8')

          if 'private theorem mottonenDenseUcry_on_root_0' not in text:
              start = text.index('theorem mottonenDenseUcry_on_root :')
              end = text.index('theorem mottonenDensePrimitive_prepares_target :', start)
              leaves = []
              for i in range(4):
                  leaves.append(f'''private theorem mottonenDenseUcry_on_root_{i} :
    (applyVec (evalPrimitiveCircuitLE mottonenDenseUcryCircuit) mottonenRootState)
        ({i} : Fin 4) = mottonenDenseState ({i} : Fin 4) := by
  unfold mottonenRootState
  exact
    (congrFun
      (applyVec_twoBasisSuperposition
        (evalPrimitiveCircuitLE mottonenDenseUcryCircuit)
        (5 / 13 : ℂ) (12 / 13 : ℂ) (0 : Fin 4) (2 : Fin 4))
      ({i} : Fin 4)).trans mottonenDenseUcry_output_{i}

''')
              leaves.append('''theorem mottonenDenseUcry_on_root :
    applyVec (evalPrimitiveCircuitLE mottonenDenseUcryCircuit) mottonenRootState =
      mottonenDenseState := by
  funext row
  fin_cases row
  · exact mottonenDenseUcry_on_root_0
  · exact mottonenDenseUcry_on_root_1
  · exact mottonenDenseUcry_on_root_2
  · exact mottonenDenseUcry_on_root_3

''')
              text = text[:start] + ''.join(leaves) + text[end:]

          if 'private theorem sparsePrunedUcry_on_root_0' not in text:
              start = text.index('theorem sparsePrunedUcry_on_root :')
              end = text.index('theorem sparsePruned_prepares_target :', start)
              leaves = []
              for i in range(8):
                  leaves.append(f'''private theorem sparsePrunedUcry_on_root_{i} :
    (applyVec (evalPrimitiveCircuitLE sparsePrunedUcryCircuit) sparseRootState)
        ({i} : Fin 8) = sparseThreeState ({i} : Fin 8) := by
  unfold sparseRootState
  exact
    (congrFun
      (applyVec_twoBasisSuperposition
        (evalPrimitiveCircuitLE sparsePrunedUcryCircuit)
        (5 / 13 : ℂ) (12 / 13 : ℂ) (0 : Fin 8) (4 : Fin 8))
      ({i} : Fin 8)).trans sparsePrunedUcry_output_{i}

''')
              leaves.append('''theorem sparsePrunedUcry_on_root :
    applyVec (evalPrimitiveCircuitLE sparsePrunedUcryCircuit) sparseRootState =
      sparseThreeState := by
  funext row
  fin_cases row
  · exact sparsePrunedUcry_on_root_0
  · exact sparsePrunedUcry_on_root_1
  · exact sparsePrunedUcry_on_root_2
  · exact sparsePrunedUcry_on_root_3
  · exact sparsePrunedUcry_on_root_4
  · exact sparsePrunedUcry_on_root_5
  · exact sparsePrunedUcry_on_root_6
  · exact sparsePrunedUcry_on_root_7

''')
              text = text[:start] + ''.join(leaves) + text[end:]

          paper.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Verify complete State Preparation suite
        run: lake build QuantumBlockEncoding.StatePreparationBenchmarks

      - name: Verify four executable Qiskit mirrors
        shell: bash
        run: |
          python3 -m pip install --quiet 'qiskit>=2,<3'
          python3 - <<'PY'
          import importlib.util
          import math
          from pathlib import Path

          path = Path('executable-exports/SP-PAPERS-001/qiskit/export.py')
          spec = importlib.util.spec_from_file_location('sp_export', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          targets = {
              'bell': ([1 / math.sqrt(2), 0, 0, 1 / math.sqrt(2)], 2, 2),
              'mottonen': ([39/169, 52/169, 60/169, 144/169], 5, 4),
              'grover-rudolph': ([9/25, 12/25, 12/25, 16/25], 2, 1),
              'sparse': ([3/13, 0, 4/13, 0, 12/13, 0, 0, 0], 5, 4),
          }
          for name, (expected, gates, depth) in targets.items():
              circuit = module.BUILDERS[name]()
              actual = list(module.Statevector.from_instruction(circuit).data)
              error = max(abs(value - target) for value, target in zip(actual, expected))
              assert error < 1e-12, (name, error)
              assert circuit.size() == gates, (name, circuit.size(), gates)
              assert circuit.depth() == depth, (name, circuit.depth(), depth)
              print(f'{name}: error={error:.3e}, gates={gates}, depth={depth}')
          PY

      - name: Verify website source contracts
        shell: bash
        run: |
          python3 -m py_compile \
            website/scripts/build_site.py \
            website/scripts/lean_graph.py \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/publish_extensions.py \
            website/scripts/publish_paper_pages.py \
            website/scripts/publish_taxonomy.py
          node --check website/static/lean-graph.js
          python3 -m unittest \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish
          python3 website/scripts/publish_taxonomy.py --check-data
          grep -Fq 'Underlying Lean Graph of Libraries' website/scripts/build_site.py
          grep -Fq '\\(A_k/(\\mathcal N_D\\mathcal N_f\\kappa)\\)' website/case-teaching.json

      - name: Commit admitted source tree to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m 'Admit State Preparation cases and interactive Lean library graph'
            git push origin HEAD:main
          fi

      - name: Close superseded State Preparation PR
        run: gh pr close 3 --repo "$GITHUB_REPOSITORY" --comment 'Admitted tree has been squash-consolidated onto main; Pages verification and branch pruning continue in this workflow.' || true

      - name: Deploy and wait for Pages
        shell: bash
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 15
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "Watching Pages run $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify deployed site
        shell: bash
        run: |
          set -euo pipefail
          base='https://dakebu.github.io/Quantum-Computing-Block-Encoding'
          for attempt in $(seq 1 30); do
            robin="$(curl -fsSL "$base/case-studies/robin/index.html" || true)"
            graph="$(curl -fsSL "$base/lean-graph/index.html" || true)"
            if printf '%s' "$graph" | grep -Fq 'Underlying Lean Graph of Libraries' \
              && printf '%s' "$robin" | grep -Fq 'Underlying Lean Graph of Libraries' \
              && printf '%s' "$robin" | grep -Fq '\(A_k/(\mathcal N_D\mathcal N_f\kappa)\)'; then
              echo 'Live Pages contains the graph and normalized Robin formula.'
              exit 0
            fi
            echo "Waiting for Pages CDN ($attempt/30)"
            sleep 10
          done
          exit 1

      - name: Delete every non-main branch
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', f'repos/{repo}/branches?per_page=100', '--slurp'
          ], text=True))
          branches = [item for page in pages for item in page]
          for branch in branches:
              name = branch['name']
              if name == 'main':
                  continue
              subprocess.run(
                  ['gh', 'api', '-X', 'DELETE', f'repos/{repo}/git/refs/heads/{name}'],
                  check=True,
              )
              print('deleted', name)
          remaining = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/branches?per_page=100'
          ], text=True))
          names = [branch['name'] for branch in remaining]
          if names != ['main']:
              raise SystemExit(f'expected only main; found {names}')
          print('single-branch invariant verified: main only')
          PY
