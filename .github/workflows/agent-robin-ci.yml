name: Agent Robin semantic verification

on:
  push:
    branches:
      - "agent/robin-t2-verified"
    paths:
      - "QuantumBlockEncoding/**"
      - "QuantumBlockEncoding.lean"
      - "Tests.lean"
      - "tools/export_robin_evolution.py"
      - ".github/workflows/agent-robin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Lean and restore project cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: false

      - name: Build changed Robin targets
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          echo "$changed"

          if grep -q '^QuantumBlockEncoding/Robin/ComplexLCU\.lean$' <<<"$changed"; then
            lake build QuantumBlockEncoding.Robin.ComplexLCU
            test ! -f QuantumBlockEncoding/Robin/ComplexLCUProjection.lean || \
              lake build QuantumBlockEncoding.Robin.ComplexLCUProjection
            test ! -f QuantumBlockEncoding/Robin/Hadamard8Verified.lean || \
              lake build QuantumBlockEncoding.Robin.Hadamard8Verified
            test ! -f QuantumBlockEncoding/Robin/SymmetryFourSlotVerified.lean || \
              lake build QuantumBlockEncoding.Robin.SymmetryFourSlotVerified
          fi

          if grep -q '^QuantumBlockEncoding/Robin/ComplexLCUProjection\.lean$' <<<"$changed"; then
            lake build QuantumBlockEncoding.Robin.ComplexLCUProjection
            test ! -f QuantumBlockEncoding/Robin/Hadamard8Verified.lean || \
              lake build QuantumBlockEncoding.Robin.Hadamard8Verified
            test ! -f QuantumBlockEncoding/Robin/SymmetryFourSlotVerified.lean || \
              lake build QuantumBlockEncoding.Robin.SymmetryFourSlotVerified
          fi

          if grep -q '^QuantumBlockEncoding/Robin/SymmetryFourSlot\.lean$' <<<"$changed"; then
            lake build QuantumBlockEncoding.Robin.SymmetryFourSlot
          fi

          if grep -q '^QuantumBlockEncoding/Robin/Hadamard8Verified\.lean$' <<<"$changed"; then
            lake build QuantumBlockEncoding.Robin.Hadamard8Verified
          fi

          if grep -q '^QuantumBlockEncoding/Robin/SymmetryFourSlotVerified\.lean$' <<<"$changed"; then
            lake build QuantumBlockEncoding.Robin.SymmetryFourSlotVerified
          fi

          if grep -q '^QuantumBlockEncoding/Robin/SixSlotOptimal\.lean$' <<<"$changed"; then
            lake build QuantumBlockEncoding.Robin.SixSlotOptimal
          fi

          if grep -q '^QuantumBlockEncoding/Robin/ResourceComparison\.lean$' <<<"$changed"; then
            lake build QuantumBlockEncoding.Robin.ResourceComparison
          fi

      - name: Full Robin regression when requested
        if: contains(github.event.head_commit.message, '[full-robin]')
        run: |
          lake build QuantumBlockEncoding.Robin.FixedN3Data
          lake build QuantumBlockEncoding.Robin.WeightedPermutation
          lake build QuantumBlockEncoding.Robin.EvolvedCandidates
          lake build QuantumBlockEncoding.Robin.SymmetryFourSlot
          lake build QuantumBlockEncoding.Robin.SixSlotOptimal
          lake build QuantumBlockEncoding.Robin.ResourceComparison
          lake build QuantumBlockEncoding.Robin.ComplexLCU
          lake build QuantumBlockEncoding.Robin.ComplexLCUProjection
          test ! -f QuantumBlockEncoding/Robin/Hadamard8Verified.lean || \
            lake build QuantumBlockEncoding.Robin.Hadamard8Verified
          test ! -f QuantumBlockEncoding/Robin/SymmetryFourSlotVerified.lean || \
            lake build QuantumBlockEncoding.Robin.SymmetryFourSlotVerified
          python3 -m pip install -r requirements-executable.txt
          python3 tools/export_robin_evolution.py --task QBE-ROBIN-BE-WARM-001 --arm warm
