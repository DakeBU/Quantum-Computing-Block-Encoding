name: Vandaele Nie Figure 3 layout

on:
  push:
    branches:
      - 'work/vandaele-nie-recursion-integration-*'
    paths:
      - 'QuantumBlockEncoding/VandaeleLemma1NieLayout.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1BorrowedNCTGadgets.lean'
      - 'QuantumBlockEncoding/ScheduledWireEmbedding.lean'
      - 'QuantumBlockEncoding/ReversibleEmbeddingDisjointness.lean'
      - '.github/workflows/vandaele-nie-layout.yml'
  pull_request:
    paths:
      - 'QuantumBlockEncoding/VandaeleLemma1NieLayout.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1BorrowedNCTGadgets.lean'
      - 'QuantumBlockEncoding/ScheduledWireEmbedding.lean'
      - 'QuantumBlockEncoding/ReversibleEmbeddingDisjointness.lean'
      - '.github/workflows/vandaele-nie-layout.yml'

permissions:
  contents: read

jobs:
  nie-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile Figure 3 layout certificate
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleLemma1NieLayout
