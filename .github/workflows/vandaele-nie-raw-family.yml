name: Vandaele Nie raw family

on:
  push:
    branches:
      - 'work/vandaele-nie-recursion-integration-*'
    paths:
      - 'QuantumBlockEncoding/VandaeleLemma1NieRawFamily.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieRecursiveStep.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieSizes.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1CleanPromise.lean'
      - '.github/workflows/vandaele-nie-raw-family.yml'
  pull_request:
    paths:
      - 'QuantumBlockEncoding/VandaeleLemma1NieRawFamily.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieRecursiveStep.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieSizes.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1CleanPromise.lean'
      - '.github/workflows/vandaele-nie-raw-family.yml'

permissions:
  contents: read

jobs:
  nie-raw-family:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile well-founded raw circuit family
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleLemma1NieRawFamily
