name: Vandaele Nie resource bounds

on:
  push:
    branches:
      - 'work/vandaele-nie-recursion-integration-*'
    paths:
      - 'QuantumBlockEncoding/VandaeleLemma1NieResourceBounds.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieRawFamily.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieRecursiveStep.lean'
      - '.github/workflows/vandaele-nie-resource-bounds.yml'
  pull_request:
    paths:
      - 'QuantumBlockEncoding/VandaeleLemma1NieResourceBounds.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieRawFamily.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieRecursiveStep.lean'
      - '.github/workflows/vandaele-nie-resource-bounds.yml'

permissions:
  contents: read

jobs:
  nie-resource-bounds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile uniform commit resource bounds
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleLemma1NieResourceBounds
