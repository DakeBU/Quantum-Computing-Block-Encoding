name: Build and deploy QuantumComputinglib and the ASPBE Lean Blueprint

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "web/**"
      - "website/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "QuantumBlockEncoding/**"
      - "QuantumBlockEncoding.lean"
      - "ABEISTests/**"
      - "Tests.lean"
      - "ABEISBlueprint/**"
      - "ABEISBlueprint.lean"
      - "ABEISBlueprintMain.lean"
      - "scripts/generate-blueprint-catalog.py"
      - "scripts/build-blueprint.sh"
      - "scripts/build-blueprint.ps1"
      - "scripts/build-website.sh"
      - "scripts/build-website.ps1"
      - "scripts/build-all.sh"
      - "scripts/build-all.ps1"
      - "scripts/sanitize-blueprint-paths.py"
      - "scripts/test-sanitize-blueprint-paths.py"
      - "docs/**"
      - "docs/assets/aspbe_harness_flow.*"
      - "tools/**"
      - "research-wiki/**"
      - "paper-notes/**"
      - "tasks/**"
      - "run-presets/**"
      - "executable-exports/**"
      - "requirements-executable.txt"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Install executable-verification dependencies
        run: python3 -m pip install -r requirements-executable.txt

      - name: Build the library and tests
        run: python3 website/scripts/run_lean_gate.py

      - name: Test the ASPBE harness
        run: python3 tools/qbe.py harness-check

      - name: Check proof trust and replay public certificates
        run: |
          python3 -m unittest website.scripts.test_site_contracts tools.test_case_memory tools.test_robin_export
          python3 tools/test_proof_trust.py
          python3 tools/check_proof_trust.py
          python3 tools/check_technical_lemma_registry.py
          python3 tools/replay_public_cases.py
          python3 tools/export_robin_evolution.py --task QBE-ROBIN-BE-WARM-001 --arm warm

      - name: Check declaration inventory and Blueprint catalog
        run: |
          python3 scripts/generate-blueprint-catalog.py --check
          python3 scripts/test-sanitize-blueprint-paths.py

      - name: Build the Verso Blueprint
        run: bash scripts/build-blueprint.sh

      - name: Build and verify the unified site
        run: bash scripts/build-website.sh

      - name: Report Pages artifact structure
        run: |
          test -f _site/index.html
          test -f _site/library/index.html
          test -f _site/ide/index.html
          test -f _site/community/index.html
          test -f _site/contributors/index.html
          test -f _site/task-builder/index.html
          test -f _site/example-cases/index.html
          test -f _site/data/example-cases.json
          test -f _site/case-studies/robin/index.html
          test -f _site/sources/ghl2025-robin-excerpts.tex
          test -f _site/data/public-case-replay.json
          test -f _site/CONTRIBUTING.md
          test -f _site/ecosystem/index.html
          test -f _site/organizers/index.html
          test -f _site/blueprint/html-multi/index.html
          test -f _site/search-index.json
          test -f _site/build-report.json
          find _site -maxdepth 2 -type f | sort

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        with:
          # Normal runs use GITHUB_TOKEN after the Pages site exists.
          # First-time enablement needs a repo secret PAT named PAGES_TOKEN
          # with Pages:write and Administration:write permission, or a classic
          # PAT with repo scope. If the secret is absent, this falls back to
          # the standard GitHub-token configuration.
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Upload combined site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
