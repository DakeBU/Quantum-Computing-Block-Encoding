name: Build and deploy QuantumComputinglib and the ASPBE Lean Blueprint

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "web/**"
      - "website/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "QuantumBlockEncoding/**"
      - "QuantumBlockEncoding.lean"
      - "ABEISTests/**"
      - "Tests.lean"
      - "ABEISBlueprint/**"
      - "ABEISBlueprint.lean"
      - "ABEISBlueprintMain.lean"
      - "scripts/generate-blueprint-catalog.py"
      - "scripts/generate-aspbe-catalog.py"
      - "scripts/build-blueprint.sh"
      - "scripts/build-blueprint.ps1"
      - "scripts/build-website.sh"
      - "scripts/build-website.ps1"
      - "scripts/build-all.sh"
      - "scripts/build-all.ps1"
      - "scripts/sanitize-blueprint-paths.py"
      - "scripts/test-sanitize-blueprint-paths.py"
      - "docs/**"
      - "docs/assets/aspbe_harness_flow.*"
      - "tools/**"
      - "research-wiki/**"
      - "paper-notes/**"
      - "tasks/**"
      - "run-presets/**"
      - "executable-exports/**"
      - "requirements-executable.txt"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "README.md"
      - "HARNESS.md"
      - "AGENTS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect proof-layer changes
        id: proof_changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            base="$(git rev-parse HEAD^1)"
          else
            git fetch --no-tags origin main
            base="origin/main"
          fi
          echo "comparison_base=${base}"
          # The publication-protocol document is reader/agent guidance, not a
          # Lean or Blueprint input. Its changed-module admission gate still runs.
          # Every inherited proof below must also match the exhaustive source hash.
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]] && git diff --quiet "${base}...HEAD" -- \
              'QuantumBlockEncoding/**' QuantumBlockEncoding.lean \
              'ABEISTests/**' Tests.lean \
              'ABEISBlueprint/**' ABEISBlueprint.lean ABEISBlueprintMain.lean \
              'tools/**' 'docs/**' 'executable-exports/**' \
              ':!tools/check_public_figure_style.py' ':!docs/assets/**' \
              ':!docs/theorem-publication-protocol.md' \
              scripts/generate-blueprint-catalog.py scripts/generate-aspbe-catalog.py \
              scripts/build-blueprint.sh scripts/build-blueprint.ps1 \
              scripts/sanitize-blueprint-paths.py scripts/test-sanitize-blueprint-paths.py \
              requirements-executable.txt lakefile.lean lake-manifest.json lean-toolchain; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Proof/Blueprint inputs unchanged; require version-checked published proof artifacts."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Running the complete Lean and Blueprint gates."
          fi

      - name: Require complete Hermite inputs
        run: |
          python3 -m unittest tools.test_hermite_artifacts website.scripts.test_proof_inputs website.scripts.test_hermite_case website.scripts.test_lean_publication_gate
          python3 tools/check_hermite_artifacts.py

      - name: Set up Lean and fetch the Mathlib cache
        if: steps.proof_changes.outputs.changed == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Install executable-verification dependencies
        run: python3 -m pip install -r requirements-executable.txt

      - name: Revalidate the committed Hermite executable packet
        run: |
          python3 executable-exports/SP-HERMITE-001/qiskit/export.py --self-test
          python3 executable-exports/SP-HERMITE-001/qiskit/replay.py

      - name: Test the independently downloaded Hermite packet
        run: python3 -m unittest website.scripts.test_hermite_download_packet

      - name: Build the library and tests
        if: steps.proof_changes.outputs.changed == 'true'
        run: python3 website/scripts/run_lean_gate.py

      - name: Test the ASPBE harness
        run: python3 tools/qbe.py harness-check

      - name: Check proof trust and executable exports
        if: steps.proof_changes.outputs.changed == 'true'
        run: |
          python3 -m unittest website.scripts.test_site_contracts tools.test_case_memory tools.test_robin_export tools.test_replay_public_cases
          python3 tools/test_proof_trust.py
          python3 tools/check_proof_trust.py
          python3 tools/check_technical_lemma_registry.py
          python3 tools/replay_public_cases.py
          python3 tools/export_robin_evolution.py --task QBE-ROBIN-BE-WARM-001 --arm warm

      - name: Generate and check declaration inventory
        if: steps.proof_changes.outputs.changed == 'true'
        run: |
          python3 -m unittest tools.test_blueprint_catalog
          python3 scripts/generate-aspbe-catalog.py
          python3 scripts/generate-aspbe-catalog.py --check
          python3 scripts/test-sanitize-blueprint-paths.py

      - name: Build the Verso Blueprint
        if: steps.proof_changes.outputs.changed == 'true'
        run: bash scripts/build-blueprint.sh

      - name: Restore unchanged published proof artifacts
        if: steps.proof_changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p /tmp/aspbe-green-pages /tmp/aspbe-green-site
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name github-pages --dir /tmp/aspbe-green-pages; then
            echo "Pages ZIP unavailable; restore the actual published Blueprint with strict input/version/link checks."
            python3 website/scripts/restore_published_blueprint.py
            exit 0
          fi
          test -f /tmp/aspbe-green-pages/artifact.tar
          tar -xf /tmp/aspbe-green-pages/artifact.tar -C /tmp/aspbe-green-site
          test -f /tmp/aspbe-green-site/build-report.json
          test -f /tmp/aspbe-green-site/blueprint/html-multi/index.html
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from website.scripts.proof_inputs import proof_input_digest, lean_module_targets
          from website.scripts.restore_published_blueprint import INPUTS
          report = json.loads(Path('/tmp/aspbe-green-site/build-report.json').read_text(encoding='utf-8'))
          gate = dict(report['leanGate'])
          if gate.get('passed') is not True or gate.get('proofInputsSha256') != proof_input_digest(Path.cwd()) or gate.get('compiledModules') != lean_module_targets(Path.cwd()):
              raise SystemExit('published exhaustive proof inputs differ; a fresh Lean build is required')
          verified_commit = str(gate.get('commit') or report['commit'])
          subprocess.run(['git', 'diff', '--exit-code', '--quiet', verified_commit, 'HEAD', '--', *INPUTS], check=True)
          gate['inheritedFromPublishedCommit'] = verified_commit
          gate['inheritanceReason'] = 'Identical exhaustive proof source/configuration and unchanged Blueprint inputs. No new Lean execution claimed.'
          gate['commit'] = os.environ['GITHUB_SHA']
          gate['proofTreeVerifiedAtCommit'] = gate.get('proofTreeVerifiedAtCommit', verified_commit)
          out = Path('_out/lean-gate.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree('/tmp/aspbe-green-site/blueprint', '_out/blueprint')
          out.write_text(json.dumps(gate, indent=2) + '\n', encoding='utf-8')
          print('Inherited identical proof tree from', verified_commit)
          PY

      - name: Build and verify the unified site
        run: bash scripts/build-website.sh

      - name: Preserve versioned restoration provenance
        run: |
          if test -f _out/published-proof-restore.json; then
            cp _out/published-proof-restore.json _site/data/research/published-proof-restore.json
          fi

      - name: Report Pages artifact structure
        run: |
          test -f _site/index.html
          test -f _site/library/index.html
          test -f _site/lean-graph/index.html
          test -f _site/data/lean-graph.json
          test -f _site/example-cases/state-preparation/index.html
          test -f _site/papers/state-preparation/index.html
          test -f _site/case-studies/robin/index.html
          test -f _site/blueprint/html-multi/index.html
          test -f _site/search-index.json
          test -f _site/build-report.json
          test -f _site/state-preparation-wiki/index.html
          test -f _site/functor-hypergraph/index.html
          test -f _site/progress/index.html
          find _site -maxdepth 2 -type f | sort

      - name: Preserve browser and publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-publication-diagnostics
          path: |
            _out/research-browser
            _out/lean-gate.json
            _out/published-proof-restore.json
            _site/build-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Upload combined site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
