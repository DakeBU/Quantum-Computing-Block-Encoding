name: Build and deploy QuantumComputinglib and the ASPBE Lean Blueprint

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "web/**"
      - "website/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "QuantumBlockEncoding/**"
      - "QuantumBlockEncoding.lean"
      - "ABEISTests/**"
      - "Tests.lean"
      - "ABEISBlueprint/**"
      - "ABEISBlueprint.lean"
      - "ABEISBlueprintMain.lean"
      - "scripts/generate-blueprint-catalog.py"
      - "scripts/build-blueprint.sh"
      - "scripts/build-blueprint.ps1"
      - "scripts/build-website.sh"
      - "scripts/build-website.ps1"
      - "scripts/build-all.sh"
      - "scripts/build-all.ps1"
      - "scripts/sanitize-blueprint-paths.py"
      - "scripts/test-sanitize-blueprint-paths.py"
      - "docs/**"
      - "docs/assets/aspbe_harness_flow.*"
      - "tools/**"
      - "research-wiki/**"
      - "paper-notes/**"
      - "tasks/**"
      - "run-presets/**"
      - "executable-exports/**"
      - "requirements-executable.txt"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# `contents: write` is temporary and used only by the main-only cleanup step
# after all verification and artifact assembly gates have passed. It is removed
# immediately after the integrated pedagogy refs have been deleted.
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect proof-layer changes
        id: proof_changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            base="$(git rev-parse HEAD^1)"
          else
            git fetch --no-tags origin main
            base="origin/main"
          fi
          echo "comparison_base=${base}"
          if git diff --quiet "${base}...HEAD" -- \
              'QuantumBlockEncoding/**' QuantumBlockEncoding.lean \
              'ABEISTests/**' Tests.lean \
              'ABEISBlueprint/**' ABEISBlueprint.lean ABEISBlueprintMain.lean \
              'tools/**' 'docs/**' \
              scripts/generate-blueprint-catalog.py \
              scripts/build-blueprint.sh scripts/build-blueprint.ps1 \
              scripts/sanitize-blueprint-paths.py scripts/test-sanitize-blueprint-paths.py \
              requirements-executable.txt lakefile.lean lake-manifest.json lean-toolchain; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Proof/Blueprint layer unchanged; reusing the latest green main proof artifacts."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Proof/Blueprint layer changed; running the complete Lean and Blueprint gates."
          fi

      - name: Set up Lean and fetch the Mathlib cache
        if: steps.proof_changes.outputs.changed == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Install executable-verification dependencies
        if: steps.proof_changes.outputs.changed == 'true'
        run: python3 -m pip install -r requirements-executable.txt

      - name: Build the library and tests
        if: steps.proof_changes.outputs.changed == 'true'
        run: python3 website/scripts/run_lean_gate.py

      - name: Test the ASPBE harness
        if: steps.proof_changes.outputs.changed == 'true'
        run: python3 tools/qbe.py harness-check

      - name: Check proof trust and executable exports
        if: steps.proof_changes.outputs.changed == 'true'
        run: |
          python3 -m unittest website.scripts.test_site_contracts tools.test_case_memory tools.test_robin_export
          python3 tools/test_proof_trust.py
          python3 tools/check_proof_trust.py
          python3 tools/check_technical_lemma_registry.py
          python3 tools/replay_public_cases.py
          python3 tools/export_robin_evolution.py --task QBE-ROBIN-BE-WARM-001 --arm warm

      - name: Check declaration inventory and Blueprint catalog
        if: steps.proof_changes.outputs.changed == 'true'
        run: |
          python3 scripts/generate-blueprint-catalog.py --check
          python3 scripts/test-sanitize-blueprint-paths.py

      - name: Build the Verso Blueprint
        if: steps.proof_changes.outputs.changed == 'true'
        run: bash scripts/build-blueprint.sh

      - name: Reuse latest green main proof artifacts
        if: steps.proof_changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "Reusing proof-layer artifact from successful main run ${run_id}."
          rm -rf /tmp/aspbe-green-pages /tmp/aspbe-green-site
          mkdir -p /tmp/aspbe-green-pages /tmp/aspbe-green-site _out/blueprint
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name github-pages --dir /tmp/aspbe-green-pages
          test -f /tmp/aspbe-green-pages/artifact.tar
          tar -xf /tmp/aspbe-green-pages/artifact.tar -C /tmp/aspbe-green-site
          test -f /tmp/aspbe-green-site/build-report.json
          test -f /tmp/aspbe-green-site/blueprint/html-multi/index.html
          cp -a /tmp/aspbe-green-site/blueprint/. _out/blueprint/
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/aspbe-green-site/build-report.json').read_text(encoding='utf-8'))
          gate = dict(report['leanGate'])
          if not gate.get('passed'):
              raise SystemExit('refusing to inherit a non-green Lean gate')
          gate['inheritedFromPublishedCommit'] = report['commit']
          gate['inheritanceReason'] = 'proof/Blueprint paths are unchanged relative to main'
          out = Path('_out/lean-gate.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(gate, indent=2) + '\n', encoding='utf-8')
          print(f"Inherited green Lean gate from {report['commit']}")
          PY

      # Keep the website gate intentionally split into named stages. A reader-facing
      # regression should identify whether syntax/tests, generation/enrichment,
      # structural verification, or the final pedagogical contract failed.
      - name: Test website generators and reader contracts
        run: |
          python3 -m py_compile \
            website/scripts/build_site.py \
            website/scripts/enrich_teaching_site.py \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/polish_casebook.py \
            website/scripts/check_site.py \
            website/scripts/ide_server.py \
            website/scripts/qbe_task_runner.py \
            website/scripts/test_site_contracts.py \
            website/scripts/test_teaching_enrichment.py \
            website/scripts/test_casebook_enrichment.py \
            website/scripts/test_casebook_polish.py \
            tools/export_robin_evolution.py \
            tools/replay_public_cases.py
          python3 -m unittest \
            website.scripts.test_site_contracts \
            website.scripts.test_teaching_enrichment \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish

      - name: Generate and enrich the unified site
        run: |
          test -f _out/lean-gate.json
          test -f _out/blueprint/html-multi/index.html
          python3 website/scripts/build_site.py \
            --lean-gate-report _out/lean-gate.json \
            --output _out/site
          python3 website/scripts/enrich_teaching_site.py --root _out/site
          python3 website/scripts/enrich_casebook.py --root _out/site
          python3 website/scripts/polish_casebook.py --root _out/site
          python3 website/scripts/enforce_robin_reader_contract.py --root _out/site
          rm -rf _site
          mkdir -p _site/blueprint
          cp -a _out/site/. _site/
          cp -a _out/blueprint/. _site/blueprint/
          touch _site/.nojekyll

      - name: Verify unified site structure and links
        run: |
          python3 website/scripts/check_site.py --root _site --require-blueprint
          python3 website/scripts/check_source_links.py --root _site
          python3 website/scripts/test_preview.py
          python3 scripts/sanitize-blueprint-paths.py --scan-only _site

      - name: Verify beginner-first Robin reader contract
        run: |
          test -f _site/index.html
          test -f _site/library/index.html
          test -f _site/blueprint/html-multi/index.html
          test -f _site/search-index.json
          test -f _site/example-cases/index.html
          test -f _site/data/example-cases.json
          test -f _site/static/learning.css
          test -f _site/static/casebook.css
          grep -q 'id="start-here"' _site/learning/index.html
          grep -q 'id="quantum-access-models"' _site/learning/index.html
          grep -q 'Digital query oracle' _site/learning/index.html
          grep -q 'How to read a quantum circuit' _site/learning/index.html
          grep -q 'data-reader-mode-choice="concept"' _site/chapters/block-encoding/index.html
          grep -q 'data-reader-mode-choice="lean"' _site/chapters/state-preparation/index.html
          grep -q 'id="case-tutorial"' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'GHL Theorem 3' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'GHL Theorem 4' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'id="paper-lean-alignment"' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'id="source-assumption-translation"' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'Paper assumption / source issue.' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'Plain language.' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'Why it matters.' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'What ASPBE improves' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'Advanced source-fidelity notes' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'data-collapsed-section="verification-status"' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'data-collapsed-section="lean-certificate"' _site/example-cases/robin-ghl-one-term/index.html
          grep -q 'data-collapsed-section="correspondence"' _site/case-studies/robin/index.html
          ! grep -q '<h2>Source interpretation decisions</h2>' _site/example-cases/robin-ghl-one-term/index.html
          test -f _site/.nojekyll

      - name: Report Pages artifact structure
        run: |
          test -f _site/index.html
          test -f _site/library/index.html
          test -f _site/ide/index.html
          test -f _site/community/index.html
          test -f _site/contributors/index.html
          test -f _site/task-builder/index.html
          test -f _site/example-cases/index.html
          test -f _site/data/example-cases.json
          test -f _site/case-studies/robin/index.html
          test -f _site/sources/ghl2025-robin-excerpts.tex
          test -f _site/data/public-case-replay.json
          test -f _site/CONTRIBUTING.md
          test -f _site/ecosystem/index.html
          test -f _site/organizers/index.html
          test -f _site/blueprint/html-multi/index.html
          test -f _site/search-index.json
          test -f _site/build-report.json
          find _site -maxdepth 2 -type f | sort

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Upload combined site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Remove integrated pedagogy branches
        if: github.ref == 'refs/heads/main'
        run: |
          for branch in agent/pedagogy-casebook agent/pedagogy-preview; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
