name: Build and deploy ABEIS website and Lean Blueprint

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "QuantumBlockEncoding/**"
      - "ABEISBlueprint/**"
      - "ABEISBlueprint.lean"
      - "ABEISBlueprintMain.lean"
      - "scripts/generate-blueprint-catalog.py"
      - "scripts/build-blueprint.sh"
      - "scripts/build-blueprint.ps1"
      - "scripts/sanitize-blueprint-paths.py"
      - "scripts/test-sanitize-blueprint-paths.py"
      - "docs/blueprint-coverage.json"
      - "research-wiki/**"
      - "paper-notes/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Check generated declaration coverage
        run: |
          python3 scripts/generate-blueprint-catalog.py --check
          python3 scripts/test-sanitize-blueprint-paths.py

      - name: Build the library and tests
        run: lake build && lake build Tests

      - name: Build the Verso Blueprint
        run: bash scripts/build-blueprint.sh

      - name: Assemble the combined Pages site
        run: |
          mkdir -p _site/blueprint
          rsync -a web/ _site/
          rsync -a _out/blueprint/ _site/blueprint/
          touch _site/.nojekyll

      - name: Scan the complete publication for local paths
        run: python3 scripts/sanitize-blueprint-paths.py --scan-only _site

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Normal runs use GITHUB_TOKEN after the Pages site exists.
          # First-time enablement needs a repo secret PAT named PAGES_TOKEN
          # with Pages:write and Administration:write permission, or a classic
          # PAT with repo scope. If the secret is absent, this falls back to
          # the standard GitHub-token configuration.
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
