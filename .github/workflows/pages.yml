name: Build and deploy QuantumComputinglib and the ASPBE Lean Blueprint

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "web/**"
      - "website/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "QuantumBlockEncoding/**"
      - "QuantumBlockEncoding.lean"
      - "ABEISTests/**"
      - "Tests.lean"
      - "ABEISBlueprint/**"
      - "ABEISBlueprint.lean"
      - "ABEISBlueprintMain.lean"
      - "scripts/generate-blueprint-catalog.py"
      - "scripts/generate-aspbe-catalog.py"
      - "scripts/build-blueprint.sh"
      - "scripts/build-blueprint.ps1"
      - "scripts/build-website.sh"
      - "scripts/build-website.ps1"
      - "scripts/build-all.sh"
      - "scripts/build-all.ps1"
      - "scripts/sanitize-blueprint-paths.py"
      - "scripts/test-sanitize-blueprint-paths.py"
      - "docs/**"
      - "docs/assets/aspbe_harness_flow.*"
      - "tools/**"
      - "research-wiki/**"
      - "paper-notes/**"
      - "tasks/**"
      - "run-presets/**"
      - "executable-exports/**"
      - "requirements-executable.txt"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect proof-layer changes
        id: proof_changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            base="$(git rev-parse HEAD^1)"
          else
            git fetch --no-tags origin main
            base="origin/main"
          fi
          echo "comparison_base=${base}"
          # Reader-facing static assets are rebuilt and checked by the website
          # contract below, but they do not change the Lean/Blueprint proof tree.
          # Reuse the latest green proof artifact for asset-only edits instead of
          # reinstalling Lean/Mathlib and rerunning the full proof gate.
          if git diff --quiet "${base}...HEAD" -- \
              'QuantumBlockEncoding/**' QuantumBlockEncoding.lean \
              'ABEISTests/**' Tests.lean \
              'ABEISBlueprint/**' ABEISBlueprint.lean ABEISBlueprintMain.lean \
              'tools/**' 'docs/**' ':(exclude)docs/assets/**' \
              scripts/generate-blueprint-catalog.py scripts/generate-aspbe-catalog.py \
              scripts/build-blueprint.sh scripts/build-blueprint.ps1 \
              scripts/sanitize-blueprint-paths.py scripts/test-sanitize-blueprint-paths.py \
              requirements-executable.txt lakefile.lean lake-manifest.json lean-toolchain; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Proof/Blueprint layer unchanged; reusing the latest green main proof artifacts."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Proof/Blueprint layer changed; running the complete Lean and Blueprint gates."
          fi

      - name: Set up Lean and fetch the Mathlib cache
        if: steps.proof_changes.outputs.changed == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Install executable-verification dependencies
        if: steps.proof_changes.outputs.changed == 'true'
        run: python3 -m pip install -r requirements-executable.txt

      - name: Build the library and tests
        if: steps.proof_changes.outputs.changed == 'true'
        run: python3 website/scripts/run_lean_gate.py

      - name: Test the ASPBE harness
        if: steps.proof_changes.outputs.changed == 'true'
        run: python3 tools/qbe.py harness-check

      - name: Check proof trust and executable exports
        if: steps.proof_changes.outputs.changed == 'true'
        run: |
          python3 -m unittest website.scripts.test_site_contracts tools.test_case_memory tools.test_robin_export
          python3 tools/test_proof_trust.py
          python3 tools/check_proof_trust.py
          python3 tools/check_technical_lemma_registry.py
          python3 tools/replay_public_cases.py
          python3 tools/export_robin_evolution.py --task QBE-ROBIN-BE-WARM-001 --arm warm

      - name: Generate and check declaration inventory
        if: steps.proof_changes.outputs.changed == 'true'
        run: |
          python3 scripts/generate-aspbe-catalog.py
          python3 scripts/generate-aspbe-catalog.py --check
          python3 scripts/test-sanitize-blueprint-paths.py

      - name: Build the Verso Blueprint
        if: steps.proof_changes.outputs.changed == 'true'
        run: bash scripts/build-blueprint.sh

      - name: Reuse latest green main proof artifacts
        if: steps.proof_changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "Reusing proof-layer artifact from successful main run ${run_id}."
          rm -rf /tmp/aspbe-green-pages /tmp/aspbe-green-site
          mkdir -p /tmp/aspbe-green-pages /tmp/aspbe-green-site _out/blueprint
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name github-pages --dir /tmp/aspbe-green-pages
          test -f /tmp/aspbe-green-pages/artifact.tar
          tar -xf /tmp/aspbe-green-pages/artifact.tar -C /tmp/aspbe-green-site
          test -f /tmp/aspbe-green-site/build-report.json
          test -f /tmp/aspbe-green-site/blueprint/html-multi/index.html
          cp -a /tmp/aspbe-green-site/blueprint/. _out/blueprint/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('/tmp/aspbe-green-site/build-report.json').read_text(encoding='utf-8'))
          gate = dict(report['leanGate'])
          if not gate.get('passed'):
              raise SystemExit('refusing to inherit a non-green Lean gate')
          verified_commit = str(gate.get('commit') or report['commit'])
          gate['inheritedFromPublishedCommit'] = verified_commit
          gate['inheritanceReason'] = 'proof/Blueprint paths are unchanged relative to main'
          gate['commit'] = os.environ['GITHUB_SHA']
          gate['proofTreeVerifiedAtCommit'] = verified_commit
          out = Path('_out/lean-gate.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(gate, indent=2) + '\n', encoding='utf-8')
          print(f"Inherited green Lean gate from {verified_commit}; rebound to docs-only checkout {os.environ['GITHUB_SHA']}")
          PY

      - name: Build and verify the unified site
        run: bash scripts/build-website.sh

      - name: Report Pages artifact structure
        run: |
          test -f _site/index.html
          test -f _site/library/index.html
          test -f _site/library/declarations.json
          test -f _site/library/search-index.json
          test -f _site/library/catalog.json
          test -f _site/implementation-map/index.html
          test -f _site/example-cases/index.html
          test -f _site/learning-roadmap/index.html
          test -f _site/lean-graph/index.html
          test -f _site/ide/index.html
          test -f _site/workspace/index.html
          test -f _site/blueprint/index.html
          test -f _site/blueprint/html-multi/index.html
          test -f _site/build-report.json
          echo "=== root ==="
          find _site -maxdepth 1 -type f -printf '%f\n' | sort
          echo "=== top-level directories ==="
          find _site -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
