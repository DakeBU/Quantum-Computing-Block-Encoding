name: Publish final admission status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admission-status.yml"

permissions:
  contents: write

concurrency:
  group: repository-admission
  cancel-in-progress: false

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Verify public State Preparation admission
        run: lake build QuantumBlockEncoding.StatePreparationBenchmarks

      - name: Verify live Pages and main-only branch invariant
        shell: bash
        run: |
          set -euo pipefail
          base='https://dakebu.github.io/Quantum-Computing-Block-Encoding'
          robin="$(curl -fsSL "$base/case-studies/robin/index.html")"
          graph="$(curl -fsSL "$base/underlying-lean-graph/index.html")"
          printf '%s' "$robin" | grep -Fq '\(N = 2^n\)'
          printf '%s' "$robin" | grep -Fq '\frac{A_k}{N_D N_f \kappa}'
          ! printf '%s' "$robin" | grep -Fq '\(\(N = 2^n\)\)'
          printf '%s' "$robin" | grep -Fq 'site-enhancements.js'
          printf '%s' "$graph" | grep -Fq 'Underlying Lean Graph of Libraries'
          printf '%s' "$graph" | grep -Fq 'lean-graph.js'
          python3 - <<'PY'
          import json
          import os
          import subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', f'repos/{repo}/branches?per_page=100', '--slurp'
          ], text=True))
          branches = [item for page in pages for item in page]
          for branch in branches:
              if branch['name'] != 'main':
                  subprocess.run(
                      ['gh', 'api', '-X', 'DELETE', f"repos/{repo}/git/refs/heads/{branch['name']}"],
                      check=True,
                  )
          remaining = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/branches?per_page=100'
          ], text=True))
          names = [branch['name'] for branch in remaining]
          if names != ['main']:
              raise SystemExit(f'expected only main; found {names}')
          PY

      - name: Write final verification evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          evidence = {
              'schemaVersion': 1,
              'verifiedAt': datetime.now(timezone.utc).isoformat(),
              'repository': repo,
              'commit': sha,
              'branchInvariant': ['main'],
              'statePreparation': {
                  'leanTarget': 'QuantumBlockEncoding.StatePreparationBenchmarks',
                  'status': 'compiled',
                  'cases': ['Bell', 'Mottonen dense UCRY', 'Grover-Rudolph product', 'Li-Luo sparse finite witness'],
              },
              'pages': {
                  'robin': 'https://dakebu.github.io/Quantum-Computing-Block-Encoding/case-studies/robin/index.html',
                  'leanGraph': 'https://dakebu.github.io/Quantum-Computing-Block-Encoding/underlying-lean-graph/',
                  'formulaChecks': ['N = 2^n', 'A_k / (N_D N_f kappa) rendered as TeX fraction'],
                  'status': 'live-verified',
              },
          }
          path = Path('docs/admission-status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/admission-status.json
          git commit -m 'Record final State Preparation and Pages admission evidence' || true
          git push origin HEAD:main
