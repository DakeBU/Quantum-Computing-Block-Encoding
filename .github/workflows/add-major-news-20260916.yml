name: Add major mathematical milestones
on:
  push:
    branches:
      - agent/news-robin-schrodingerisation-20260916
    paths:
      - .github/workflows/add-major-news-20260916.yml
      - .github/scripts/apply_major_news_20260916.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/news-robin-schrodingerisation-20260916
          fetch-depth: 0
      - run: python3 .github/scripts/apply_major_news_20260916.py
      - run: |
          python3 -m py_compile website/scripts/build_site.py
          grep -q '14 August 2026' README.md
          grep -q '10 September 2026' README.md
          grep -q 'datetime="2026-09-10"' website/scripts/build_site.py
          grep -q 'datetime="2026-08-14"' website/scripts/build_site.py
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-major-news-20260916.yml .github/scripts/apply_major_news_20260916.py
          git add README.md website/scripts/build_site.py
          git commit -m 'Add audited Robin and Schrödingerisation milestones'
          git push origin HEAD:agent/news-robin-schrodingerisation-20260916
