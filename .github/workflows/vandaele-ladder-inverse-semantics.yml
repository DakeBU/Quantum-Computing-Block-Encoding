name: Vandaele ladder inverse and Equation 5 permutation frontier

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/VandaeleLadderContract.lean"
      - "QuantumBlockEncoding/VandaeleLadderDescendingIndices.lean"
      - "QuantumBlockEncoding/VandaeleLadderEquationFiveSemantics.lean"
      - "QuantumBlockEncoding/VandaeleLadderInverseSemantics.lean"
      - ".github/workflows/vandaele-ladder-inverse-semantics.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-ladder-inverse-semantics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inverse-semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile inverse and Equation 5 permutation frontier
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleLadderInverseSemantics
