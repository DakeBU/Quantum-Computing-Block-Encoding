name: Vandaele Equation 18 semantics frontier

on:
  pull_request:
    branches:
      - "agent/vandaele-definition24-semantics"
    paths:
      - "QuantumBlockEncoding/VandaeleLadderEquationFiveSemantics.lean"
      - "QuantumBlockEncoding/VandaeleLadderInverseSemantics.lean"
      - "QuantumBlockEncoding/VandaeleLadderVSemantics.lean"
      - "QuantumBlockEncoding/VandaeleLadderEquationEighteenSemantics.lean"
      - ".github/workflows/vandaele-equation18-semantics.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-equation18-semantics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  equation18-semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile Equation 18 semantics frontier
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleLadderEquationEighteenSemantics
