name: One-shot refresh route catalog after Lean fixes

on:
  push:
    branches:
      - "agent/complete-foundation-routes"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v5
        with:
          ref: agent/complete-foundation-routes

      - name: Regenerate declaration inventory and Blueprint catalog
        run: python3 scripts/generate-blueprint-catalog.py

      - name: Remove this one-shot workflow and commit deterministic output
        shell: bash
        run: |
          rm .github/workflows/one-shot-refresh-route-catalog.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes; one-shot workflow removal is the only expected diff."
          fi
          git commit -m "Regenerate route catalog after proof fixes"
          git push origin HEAD:agent/complete-foundation-routes
