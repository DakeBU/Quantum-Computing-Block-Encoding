name: One-shot refresh vivid harness image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-vivid-harness-main.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert vivid WebP to lightweight PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('docs/assets/aspbe_hierarchical_harness.webp')
          dst = Path('docs/assets/hierarchical_harness.png')

          img = Image.open(src).convert('RGBA')
          target_width = 1200
          target_height = round(img.height * target_width / img.width)
          img = img.resize((target_width, target_height), Image.Resampling.LANCZOS)
          img = img.convert('P', palette=Image.Palette.ADAPTIVE, colors=192)
          img.save(dst, format='PNG', optimize=True, compress_level=9)

          size = dst.stat().st_size
          print(f'{dst}: {target_width}x{target_height}, {size} bytes')
          if size > 300_000:
              raise SystemExit(f'PNG is unexpectedly large: {size} bytes')
          PY

      - name: Commit refreshed image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/hierarchical_harness.png
          if git diff --cached --quiet; then
            echo 'No image change produced.'
            exit 0
          fi
          git commit -m 'Use vivid lightweight hierarchy image'
          git push origin HEAD:main
