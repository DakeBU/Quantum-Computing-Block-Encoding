name: Vandaele Figure 5 full comparator semantics

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/VandaeleFigure5ComparatorSemantics.lean"
      - "QuantumBlockEncoding/VandaeleFigure5ComparatorDirection.lean"
      - "QuantumBlockEncoding/VandaeleFigure5ComparatorRepair.lean"
      - "QuantumBlockEncoding/VandaeleFigure5ComparatorFullSemantics.lean"
      - ".github/workflows/vandaele-figure5-full-comparator.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-figure5-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-comparator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile full Figure 5 comparator semantics
        run: lake build QuantumBlockEncoding.VandaeleFigure5ComparatorFullSemantics
