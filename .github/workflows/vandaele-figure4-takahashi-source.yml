name: Vandaele Figure 4 Takahashi source program

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/VandaeleFigure4TakahashiSourceProgram.lean"
      - "QuantumBlockEncoding/VandaeleFigure4TakahashiCarryAlgebra.lean"
      - "QuantumBlockEncoding/ReversibleClassical.lean"
      - "QuantumBlockEncoding/PrimitiveSemantics.lean"
      - ".github/workflows/vandaele-figure4-takahashi-source.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-figure4-takahashi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  figure4-source-program:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile reversible source IR
        run: lake build QuantumBlockEncoding.ReversibleClassical

      - name: Compile local Takahashi carry algebra
        run: lake build QuantumBlockEncoding.VandaeleFigure4TakahashiCarryAlgebra

      - name: Compile authoritative five-bit source transcription
        run: lake build QuantumBlockEncoding.VandaeleFigure4TakahashiSourceProgram
