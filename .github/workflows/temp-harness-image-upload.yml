name: Temporary Harness image upload

on:
  push:
    branches:
      - work/use-generated-harness-comic-20260827
    paths:
      - tools/harness_image_upload/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decode generated Harness image
        shell: bash
        run: |
          set -euo pipefail
          cat tools/harness_image_upload/chunk_*.txt | base64 -d > docs/assets/aspbe_current_harness.webp
          test -s docs/assets/aspbe_current_harness.webp
          file docs/assets/aspbe_current_harness.webp
      - name: Commit materialized image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r tools/harness_image_upload
          git add docs/assets/aspbe_current_harness.webp
          git commit -m 'Add generated current Harness comic'
          git push origin HEAD:${GITHUB_REF_NAME}
