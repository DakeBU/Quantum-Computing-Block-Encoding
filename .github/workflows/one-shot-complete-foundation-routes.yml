name: One-shot complete foundation route catalog migration

on:
  push:
    branches:
      - "agent/complete-foundation-routes"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the focused branch
        uses: actions/checkout@v5
        with:
          ref: agent/complete-foundation-routes

      - name: Apply deterministic source migration
        run: python3 scripts/one_shot_complete_foundation_routes.py

      - name: Regenerate declaration catalog
        run: python3 scripts/generate-blueprint-catalog.py

      - name: Commit deterministic migration output
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No migration changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete proof-backed foundation routes"
          git push origin HEAD:agent/complete-foundation-routes
