name: One-shot complete foundation route catalog migration

on:
  push:
    branches:
      - agent/complete-foundation-routes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the focused branch
        uses: actions/checkout@v5
        with:
          ref: agent/complete-foundation-routes

      - name: Patch imports, route classification, and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("QuantumBlockEncoding.lean")
          root_text = root.read_text(encoding="utf-8")
          root_import = "import QuantumBlockEncoding.RouteClosureCertificates\n"
          if root_import not in root_text:
              root_text = root_text.rstrip() + "\n" + root_import
              root.write_text(root_text, encoding="utf-8", newline="\n")

          tests = Path("Tests.lean")
          tests_text = tests.read_text(encoding="utf-8")
          test_import = "import ABEISTests.RouteClosureCertificates\n"
          if test_import not in tests_text:
              tests_text = tests_text.rstrip() + "\n" + test_import
              tests.write_text(tests_text, encoding="utf-8", newline="\n")

          generator = Path("scripts/generate-blueprint-catalog.py")
          generator_text = generator.read_text(encoding="utf-8")
          catalog_anchor = '            "TeachingRouteClosures.lean",\n'
          catalog_addition = catalog_anchor + '            "RouteClosureCertificates.lean",\n'
          if '            "RouteClosureCertificates.lean",\n' not in generator_text:
              if catalog_anchor not in generator_text:
                  raise SystemExit("catalog anchor not found")
              generator_text = generator_text.replace(catalog_anchor, catalog_addition, 1)

          old_classifier = '''def route_status(decl: Declaration) -> str:
              if decl.open_proof:
                  return "Blocked"
              if decl.experimental:
                  return "Experimental"
              if decl.source.endswith("OpenProblems.lean"):
                  return "Planned"
              if decl.source.endswith(
                  ("GHL2025.lean", "RobinEvolution.lean", "Automation.lean", "Literature.lean")
              ):
                  return "Partial route"
              if decl.kind in {"structure", "class", "opaque"}:
                  return "Partial route"
              return "Compiled"
          '''
          new_classifier = '''PARTIAL_ROUTE_SOURCES = {
              "QuantumBlockEncoding/GHL2025.lean",
          }

          PARTIAL_ROUTE_DECLARATIONS = {
              "QuantumBlockEncoding.CubicDiagonalOracle.primitiveAmplitudeOracleUnitary",
              "QuantumBlockEncoding.CubicDiagonalOracle.primitiveAmplitudeOracleIsUnitary",
              "QuantumBlockEncoding.CubicDiagonalOracle.primitiveAmplitudeOracleCleanBlockExtracts",
              "QuantumBlockEncoding.CubicDiagonalOracle.expandedArithmeticComputesCubicAmplitude",
              "QuantumBlockEncoding.CubicDiagonalOracle.expandedControlledRyUsesCubicAngle",
              "QuantumBlockEncoding.CubicDiagonalOracle.expandedWorkspaceCleanUncomputed",
              "QuantumBlockEncoding.CubicDiagonalOracle.expandedAmplitudeOracleCleanBlockExtracts",
          }


def route_status(decl: Declaration) -> str:
              """Classify route completion from explicit proof scope, never declaration kind."""

              if decl.open_proof:
                  return "Blocked"
              if decl.experimental:
                  return "Experimental"
              if decl.source.endswith("OpenProblems.lean"):
                  return "Planned"
              if (
                  decl.source in PARTIAL_ROUTE_SOURCES
                  or decl.full_name in PARTIAL_ROUTE_DECLARATIONS
              ):
                  return "Partial route"
              return "Compiled"
          '''
          if "PARTIAL_ROUTE_SOURCES =" not in generator_text:
              if old_classifier not in generator_text:
                  raise SystemExit("old route-status classifier not found")
              generator_text = generator_text.replace(old_classifier, new_classifier, 1)
          generator.write_text(generator_text, encoding="utf-8", newline="\n")

          site_tests = Path("website/scripts/test_site_contracts.py")
          site_text = site_tests.read_text(encoding="utf-8")
          method_name = "test_library_route_status_is_proof_rooted"
          if method_name not in site_text:
              marker = "    def test_roadmap_separates_closed_witnesses_from_open_generality(self) -> None:\n"
              if marker not in site_text:
                  raise SystemExit("site-test insertion point not found")
              method = '''    def test_library_route_status_is_proof_rooted(self) -> None:
                  data = json.loads(
                      (ROOT / "web/library/declarations.json").read_text(encoding="utf-8")
                  )
                  declarations = data["declarations"]
                  by_name = {item["fullName"]: item for item in declarations}
                  for name in (
                      "QuantumBlockEncoding.RegisterLayout",
                      "QuantumBlockEncoding.StatePreparationTarget",
                      "QuantumBlockEncoding.OperatorBlockEncodingCandidate",
                      "QuantumBlockEncoding.ExecutableResourceCertificate",
                      "QuantumBlockEncoding.ApproximateStatePreparationCandidate.certify",
                      "QuantumBlockEncoding.ApproximateOperatorBlockEncodingCandidate.certify",
                  ):
                      self.assertEqual(by_name[name]["localStatus"], "Compiled", name)
                      self.assertEqual(by_name[name]["routeStatus"], "Compiled", name)

                  partial = [
                      item for item in declarations
                      if item["routeStatus"] == "Partial route"
                  ]
                  self.assertTrue(partial)
                  allowed_opaque = {
                      "QuantumBlockEncoding.CubicDiagonalOracle.primitiveAmplitudeOracleUnitary",
                      "QuantumBlockEncoding.CubicDiagonalOracle.primitiveAmplitudeOracleIsUnitary",
                      "QuantumBlockEncoding.CubicDiagonalOracle.primitiveAmplitudeOracleCleanBlockExtracts",
                      "QuantumBlockEncoding.CubicDiagonalOracle.expandedArithmeticComputesCubicAmplitude",
                      "QuantumBlockEncoding.CubicDiagonalOracle.expandedControlledRyUsesCubicAngle",
                      "QuantumBlockEncoding.CubicDiagonalOracle.expandedWorkspaceCleanUncomputed",
                      "QuantumBlockEncoding.CubicDiagonalOracle.expandedAmplitudeOracleCleanBlockExtracts",
                  }
                  for item in partial:
                      self.assertTrue(
                          item["source"] == "QuantumBlockEncoding/GHL2025.lean"
                          or item["fullName"] in allowed_opaque,
                          item["fullName"],
                      )

          '''
              site_text = site_text.replace(marker, method + marker, 1)
              site_tests.write_text(site_text, encoding="utf-8", newline="\n")
          PY

      - name: Regenerate declaration catalog
        run: python3 scripts/generate-blueprint-catalog.py

      - name: Commit deterministic migration output
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No migration changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete proof-backed foundation routes"
          git push origin HEAD:agent/complete-foundation-routes
