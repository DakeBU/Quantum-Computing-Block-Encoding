name: Reversible schedule Lean 4.29 compatibility

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/ReversibleSchedule.lean"
      - ".github/workflows/reversible-schedule-lean429.yml"
  workflow_dispatch:

concurrency:
  group: reversible-schedule-lean429-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile reversible schedule infrastructure
        run: lake build QuantumBlockEncoding.ReversibleSchedule
