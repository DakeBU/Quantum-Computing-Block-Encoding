name: Research final rendering repair
on:
  push:
    branches: ["agent/structure-atlas-stateprepwiki-20260915"]
    paths: [".github/workflows/research-integration.yml"]
permissions:
  contents: write
  actions: read
concurrency:
  group: research-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    if: github.ref == 'refs/heads/agent/structure-atlas-stateprepwiki-20260915'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, ref: agent/structure-atlas-stateprepwiki-20260915}
      - name: Apply the inspected formula and navigation source repair
        run: |
          set -euo pipefail
          sed 's/^ diff --git /diff --git /' website/reader-edges.patch > /tmp/aspbe-reader-edges.patch
          git apply --check /tmp/aspbe-reader-edges.patch
          git apply /tmp/aspbe-reader-edges.patch
          git rm website/reader-edges.patch
          python3 -m py_compile website/scripts/lean_graph.py website/scripts/test_research_browser.py
          python3 -m unittest website.scripts.test_research_atlas tools.test_powershell_builds
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/scripts/lean_graph.py website/scripts/research_atlas.py website/scripts/test_research_browser.py website/static/research-atlas.css website/static/research-atlas.js website/static/research-delta.js
          git commit -m 'Repair graph formula delimiters and verify exact-node navigation and contribution exports'
          git push origin HEAD:agent/structure-atlas-stateprepwiki-20260915
      - name: Restore only identical published proof and Blueprint inputs
        run: python3 website/scripts/restore_published_blueprint.py
      - name: Install executable artifact checks
        run: python3 -m pip install -r requirements-executable.txt
      - name: Rebuild and validate the final reader
        env: {ASPBE_PUBLICATION_BASE: 8ac04215547dcb7c40deb18b54450b03c3f6f4f6}
        run: |
          set -o pipefail
          mkdir -p _out/research-diagnostics
          bash scripts/build-website.sh 2>&1 | tee _out/research-diagnostics/reader-final.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-reader-validation
          path: |
            _out/research-browser
            _out/research-diagnostics
            _out/lean-gate.json
            _site
          retention-days: 7
          if-no-files-found: warn
