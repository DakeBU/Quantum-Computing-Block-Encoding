name: Prepare final GHL textbook branch

on:
  push:
    branches:
      - agent/ghl-hamiltonian-textbook

permissions:
  contents: write

concurrency:
  group: focused-ghl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tighten optional Lean display and remove temporary files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('website/static/learning.css')
          text = path.read_text(encoding='utf-8')
          old = '''body.reader-mode-enabled:not([data-reader-mode="lean"]) main > .result,\nbody.reader-mode-enabled:not([data-reader-mode="lean"]) main > .content-section > .result {\n  display: none;\n}\n'''
          new = '''body.reader-mode-enabled:not([data-reader-mode="lean"]) main .result {\n  display: none;\n}\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('reader-mode result selector anchor missing')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f website/static/learning.js
          rm -f tools/fix_ghl_hamiltonian_conj.py
          rm -f tools/extend_ghl_adjoint.py
          rm -f tools/fix_roadmap_test.py
          rm -f tools/finalize_ghl_teaching.py
      - name: Regenerate committed declaration and Blueprint inventories
        run: python3 scripts/generate-blueprint-catalog.py
      - name: Check teaching and publication source contracts
        run: |
          python3 -m py_compile website/scripts/enrich_teaching_site.py website/scripts/test_teaching_enrichment.py website/scripts/test_site_contracts.py
          python3 -m unittest website.scripts.test_teaching_enrichment website.scripts.test_site_contracts
          python3 scripts/generate-blueprint-catalog.py --check
          git diff --check
      - name: Remove this temporary workflow and commit the clean frontier
        run: |
          git rm .github/workflows/agent-ghl-focused.yml
          git config user.name "ASPBE verification agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize GHL Hamiltonian textbook integration"
          git push origin HEAD:agent/ghl-hamiltonian-textbook
