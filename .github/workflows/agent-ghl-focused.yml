name: Focused GHL Hamiltonian and teaching gate

on:
  push:
    branches:
      - agent/ghl-hamiltonian-textbook
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-ghl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Apply focused conjugation simplifier
        run: python3 tools/fix_ghl_hamiltonian_conj.py
      - name: Compile GHL Hamiltonian composition and regression roots
        run: lake build QuantumBlockEncoding.GHLHamiltonian ABEISTests.GHLHamiltonian
      - name: Check teaching data and enrichment code
        run: |
          python3 -m py_compile website/scripts/enrich_teaching_site.py website/scripts/test_teaching_enrichment.py
          python3 -m unittest website.scripts.test_teaching_enrichment
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('website/textbook-lessons.json').read_text())
          assert len(data['chapters']) == 9
          PY
      - name: Check diff hygiene
        run: git diff --check
      - name: Persist a successful Lean source repair
        run: |
          if ! git diff --quiet -- QuantumBlockEncoding/GHLHamiltonian.lean; then
            git config user.name "ASPBE verification agent"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add QuantumBlockEncoding/GHLHamiltonian.lean
            git commit -m "Close GHL Theorem 4 Hamiltonian algebra"
            git push origin HEAD:agent/ghl-hamiltonian-textbook
          fi
