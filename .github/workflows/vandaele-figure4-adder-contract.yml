name: Vandaele Figure 4 adder contract bridge

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/VandaeleComparatorContract.lean"
      - "QuantumBlockEncoding/VandaeleComparatorBitArithmetic.lean"
      - "QuantumBlockEncoding/VandaeleFigure4*.lean"
      - ".github/workflows/vandaele-figure4-adder-contract.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-figure4-adder-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adder-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile Figure 4 source-to-adder contract bridge
        run: lake build QuantumBlockEncoding.VandaeleFigure4AdderContractBridge
