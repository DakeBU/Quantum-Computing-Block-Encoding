name: README Lean graph admission

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-lean-graph-admission.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-admission
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Add the interactive Lean topology to the README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          source = path.read_text(encoding='utf-8')
          heading = '## Underlying Lean Graph of Libraries'
          if heading not in source:
              section = '''
## Underlying Lean Graph of Libraries

[Open the interactive QuantumComputinglib graph](https://dakebu.github.io/Quantum-Computing-Block-Encoding/underlying-lean-graph/)

The public graph makes the formal substrate inspectable rather than presenting State Preparation and Block Encoding as disconnected collections of technical tricks. Its first authority layer records **actual Lean module-import edges**. Selecting a module reveals its declaration leaves, source location, imported prerequisites, downstream dependents, and methodological role.

Use the graph through four complementary lenses:

- **mathematical object:** states, matrices, linear maps, signal/system blocks, and constrained unitary completions;
- **access contract:** the input/output and query-oracle obligations a construction must satisfy;
- **construction topology:** which reusable proof branches a textbook or paper route connects or extends;
- **lexicographic evolution:** whether a verified candidate changes only a leaf, improves gate/depth/ancilla/oracle cost, or creates a genuinely new formal connection.

This module/declaration map is the first stage of the planned compressed proof graph. Later stages will extract declaration-level dependencies from Lean environments, quotient recurring finite-coordinate and basis-action motifs, and expose higher-level common structure across apparently different State Preparation and Block Encoding techniques.

'''
              marker = '## Route I — State Preparation'
              if marker in source:
                  source = source.replace(marker, section + marker, 1)
              else:
                  source = source.rstrip() + '\n\n' + section
              path.write_text(source, encoding='utf-8')
          PY
          python3 tools/check_public_figure_style.py
          git diff --check

      - name: Commit README graph guide and redeploy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Explain the interactive underlying Lean library graph'
            git push origin HEAD:main
          fi
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 15
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify graph page and delete remaining non-main branches
        shell: bash
        run: |
          set -euo pipefail
          base='https://dakebu.github.io/Quantum-Computing-Block-Encoding'
          for attempt in $(seq 1 30); do
            graph="$(curl -fsSL "$base/underlying-lean-graph/index.html" || true)"
            if printf '%s' "$graph" | grep -Fq 'Underlying Lean Graph of Libraries'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 10
          done
          python3 - <<'PY'
          import json
          import os
          import subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', f'repos/{repo}/branches?per_page=100', '--slurp'
          ], text=True))
          for branch in [item for page in pages for item in page]:
              if branch['name'] != 'main':
                  subprocess.run(
                      ['gh', 'api', '-X', 'DELETE', f"repos/{repo}/git/refs/heads/{branch['name']}"],
                      check=True,
                  )
          remaining = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/branches?per_page=100'
          ], text=True))
          if [branch['name'] for branch in remaining] != ['main']:
              raise SystemExit('non-main branches remain')
          print('README, Pages graph, and main-only branch invariant verified')
          PY
