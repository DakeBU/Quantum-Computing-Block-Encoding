name: Research release candidate
on:
  push:
    branches: ["agent/structure-atlas-stateprepwiki-20260915"]
    paths: [".github/workflows/research-release.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: research-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    if: github.ref == 'refs/heads/agent/structure-atlas-stateprepwiki-20260915'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Test the exact candidate source contracts
        run: |
          set -euo pipefail
          python3 -m unittest website.scripts.test_research_atlas tools.test_powershell_builds
          git diff --check
      - name: Restore the unchanged actually published Blueprint
        run: python3 website/scripts/restore_published_blueprint.py
      - name: Install the pinned Lean compiler and dependency cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Execute the complete current Lean and test gate
        run: python3 website/scripts/run_lean_gate.py
      - name: Install finite executable checks
        run: python3 -m pip install -r requirements-executable.txt
      - name: Check current harness, proof trust and executable artifacts
        run: |
          python3 tools/qbe.py harness-check
          python3 tools/check_proof_trust.py
          python3 tools/check_technical_lemma_registry.py
          python3 executable-exports/SP-HERMITE-001/qiskit/export.py --self-test
          python3 executable-exports/SP-HERMITE-001/qiskit/replay.py
          python3 tools/replay_public_cases.py
          python3 tools/export_robin_evolution.py --task QBE-ROBIN-BE-WARM-001 --arm warm
      - name: Rebuild all current reader pages and run website/browser gates
        env: {ASPBE_PUBLICATION_BASE: 8ac04215547dcb7c40deb18b54450b03c3f6f4f6}
        run: |
          set -o pipefail
          mkdir -p _out/research-diagnostics
          bash scripts/build-website.sh 2>&1 | tee _out/research-diagnostics/release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-release-evidence
          path: |
            _site
            _out/research-browser
            _out/research-diagnostics
            _out/lean-gate.json
            _out/published-proof-restore.json
          retention-days: 7
          if-no-files-found: warn
