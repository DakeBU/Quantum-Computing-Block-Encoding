name: Research reader preview
on:
  push:
    branches: ["agent/**"]
    paths:
      - "website/research/**"
      - "website/scripts/research_atlas.py"
      - "website/scripts/test_research_browser.py"
      - "website/static/research-atlas.*"
      - ".github/workflows/research-reader-preview.yml"
  pull_request:
    paths: ["website/research/**", "website/scripts/**", "website/static/research-atlas.*"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: research-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Retrieve the last published proof-backed site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p _out/research-preview-artifact _preview
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name github-pages --dir _out/research-preview-artifact
          tar -xf _out/research-preview-artifact/artifact.tar -C _preview
      - name: Require identical proof inputs before inheritance
        id: proof
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from website.scripts.proof_inputs import proof_input_digest, lean_module_targets
          path = Path('_preview/build-report.json')
          report = json.loads(path.read_text())
          gate = report['leanGate']
          same = gate.get('passed') is True and gate.get('proofInputsSha256') == proof_input_digest(Path('.')) and gate.get('compiledModules') == lean_module_targets(Path('.'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'eligible={str(same).lower()}\n')
          if not same:
              print('Preview inheritance is ineligible: run the ordinary complete Lean/Pages pipeline. No proof or reader success is claimed here.')
          else:
              old = gate['commit']
              gate['commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              gate['proofTreeVerifiedAtCommit'] = old
              gate['inheritanceReason'] = 'Reader-only preview: identical complete Lean source/configuration hashes and compiled module inventory; no new Lean execution claimed.'
              report['leanGate'] = gate
              path.write_text(json.dumps(report, indent=2) + '\n')
              print('Reader preview inherits identical proof tree from', old)
          PY
      - name: Publish and validate the new views
        if: steps.proof.outputs.eligible == 'true'
        run: |
          python3 website/scripts/research_atlas.py publish --root _preview
          python3 website/scripts/research_atlas.py check-site --root _preview
          python3 website/scripts/check_site.py --root _preview --require-blueprint
      - name: Render themes, mobile mathematics and complete hyperedges
        if: steps.proof.outputs.eligible == 'true'
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 website/scripts/test_research_browser.py --root _preview
      - name: Upload preview and diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reader-preview
          path: |
            _preview
            _out/research-browser
          if-no-files-found: warn
          retention-days: 7
