name: Vandaele Corollary 3 controlled quantum-adder target

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/PrimitiveBasisModularArithmetic.lean"
      - "QuantumBlockEncoding/VandaeleQuantumAdderTarget.lean"
      - "QuantumBlockEncoding/VandaeleCorollary3ControlledQuantumAdderTarget.lean"
      - ".github/workflows/vandaele-corollary3-controlled-target.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-corollary3-controlled-target-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controlled-target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile pure Corollary 3 controlled-adder target
        run: lake build QuantumBlockEncoding.VandaeleCorollary3ControlledQuantumAdderTarget
