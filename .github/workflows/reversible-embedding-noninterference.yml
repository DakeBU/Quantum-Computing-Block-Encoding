name: Reversible embedding noninterference

on:
  push:
    branches:
      - 'work/vandaele-nie-recursion-integration-*'
    paths:
      - 'QuantumBlockEncoding/ReversibleEmbeddingNoninterference.lean'
      - 'QuantumBlockEncoding/ReversibleEmbeddingDisjointness.lean'
      - 'QuantumBlockEncoding/ScheduledWireEmbedding.lean'
      - 'QuantumBlockEncoding/ReversibleWireEmbedding.lean'
      - '.github/workflows/reversible-embedding-noninterference.yml'
  pull_request:
    paths:
      - 'QuantumBlockEncoding/ReversibleEmbeddingNoninterference.lean'
      - 'QuantumBlockEncoding/ReversibleEmbeddingDisjointness.lean'
      - 'QuantumBlockEncoding/ScheduledWireEmbedding.lean'
      - 'QuantumBlockEncoding/ReversibleWireEmbedding.lean'
      - '.github/workflows/reversible-embedding-noninterference.yml'

permissions:
  contents: read

jobs:
  embedding-noninterference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile embedding noninterference theorem
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.ReversibleEmbeddingNoninterference
