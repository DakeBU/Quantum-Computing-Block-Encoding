name: Site rendering admission

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-rendering-admission.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-admission
  cancel-in-progress: false

jobs:
  render-and-redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Make known formula repair idempotent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('website/scripts/publish_site_enhancements.py')
          if not path.is_file():
              raise SystemExit('publish_site_enhancements.py is not yet admitted on main')
          source = path.read_text(encoding='utf-8')
          start = source.index('KNOWN_REPLACEMENTS = (')
          end = source.index('\n)\n\n\ndef relative_asset', start) + 3
          table = '''KNOWN_REPLACEMENTS = (
    ("N=2^n", r"\\(N = 2^n\\)"),
    ("A_k/(N_D N_f kappa)", r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)"),
    ("A_k/(N_D N_f kappa", r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)"),
    ("A_k / (N_D N_f kappa)", r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)"),
    ("A_k / (N_D N_f kappa", r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)"),
)
'''
          source = source[:start] + table + source[end:]

          function = re.compile(
              r'def replace_known_formulae\(source: str\) -> str:\n(?:    .*\n)+?    return source\n',
              re.M,
          )
          replacement = '''def replace_known_formulae(source: str) -> str:
    # Use negative delimiter guards so a repeated site build never produces
    # nested ``\\(\\(...\\)\\)`` MathJax source.
    source = re.sub(
        r"(?<!\\\\\\\()N=2\\^n(?!\\\\\\\))",
        r"\\\\(N = 2^n\\\\)",
        source,
    )
    source = re.sub(
        r"(?<!\\\\frac\\{)A_k\\s*/\\s*\\(\\s*N_D\\s+N_f\\s+(?:kappa|κ)\\s*\\)?",
        r"\\\\(\\\\frac{A_k}{N_D N_f \\\\kappa}\\\\)",
        source,
    )
    return source
'''
          source, count = function.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('could not replace formula-normalization function')
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Test idempotent formula and graph navigation installation
        shell: bash
        run: |
          python3 -m py_compile website/scripts/publish_site_enhancements.py
          node --check website/static/site-enhancements.js
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/static" "$tmp/case-studies/robin"
          cp website/static/site-enhancements.js website/static/site-enhancements.css "$tmp/static/"
          printf '%s\n' '<!doctype html><html><head></head><body><aside><nav></nav></aside><p>N=2^n</p><p>A_k/(N_D N_f kappa</p></body></html>' > "$tmp/case-studies/robin/index.html"
          python3 website/scripts/publish_site_enhancements.py --root "$tmp"
          python3 website/scripts/publish_site_enhancements.py --root "$tmp"
          grep -Fq '\(N = 2^n\)' "$tmp/case-studies/robin/index.html"
          grep -Fq '\frac{A_k}{N_D N_f \kappa}' "$tmp/case-studies/robin/index.html"
          ! grep -Fq '\(\(N = 2^n\)\)' "$tmp/case-studies/robin/index.html"
          grep -Fq 'site-enhancements.js' "$tmp/case-studies/robin/index.html"

      - name: Commit renderer correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/scripts/publish_site_enhancements.py
          if git diff --cached --quiet; then
            echo 'Formula publisher already idempotent.'
          else
            git commit -m 'Make public formula normalization idempotent'
            git push origin HEAD:main
          fi

      - name: Dispatch Pages and wait
        shell: bash
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 15
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify live formulae, graph, and single-main invariant
        shell: bash
        run: |
          set -euo pipefail
          base='https://dakebu.github.io/Quantum-Computing-Block-Encoding'
          for attempt in $(seq 1 30); do
            robin="$(curl -fsSL "$base/case-studies/robin/index.html" || true)"
            graph="$(curl -fsSL "$base/underlying-lean-graph/index.html" || true)"
            if printf '%s' "$robin" | grep -Fq '\(N = 2^n\)' \
              && printf '%s' "$robin" | grep -Fq '\frac{A_k}{N_D N_f \kappa}' \
              && ! printf '%s' "$robin" | grep -Fq '\(\(N = 2^n\)\)' \
              && printf '%s' "$graph" | grep -Fq 'Underlying Lean Graph of Libraries'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 10
          done
          python3 - <<'PY'
          import json
          import os
          import subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', f'repos/{repo}/branches?per_page=100', '--slurp'
          ], text=True))
          branches = [item for page in pages for item in page]
          for branch in branches:
              name = branch['name']
              if name != 'main':
                  subprocess.run(
                      ['gh', 'api', '-X', 'DELETE', f'repos/{repo}/git/refs/heads/{name}'],
                      check=True,
                  )
          remaining = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/branches?per_page=100'
          ], text=True))
          names = [branch['name'] for branch in remaining]
          if names != ['main']:
              raise SystemExit(f'expected only main; found {names}')
          print('live rendering and single-main invariant verified')
          PY
