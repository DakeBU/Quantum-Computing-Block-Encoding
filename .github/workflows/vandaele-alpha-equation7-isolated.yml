name: Vandaele alpha Equation-7 isolated admission

on:
  pull_request:
    branches:
      - "codex/vandaele-alpha-equation7-proof"
    paths:
      - "QuantumBlockEncoding/RemaudVandaeleLadderAlpha*.lean"
      - "QuantumBlockEncoding/MultiControlledX*.lean"
      - ".github/workflows/vandaele-alpha-equation7-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equation-seven-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile isolated Algorithm 2 semantic frontier
        run: lake build QuantumBlockEncoding.RemaudVandaeleLadderAlphaSemanticFrontier
