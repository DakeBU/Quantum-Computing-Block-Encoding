name: Formula normalization v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/formula-normalization-v2.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-admission
  cancel-in-progress: false

jobs:
  normalize-redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Replace formula normalizer by exact source boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('website/scripts/publish_site_enhancements.py')
          if not path.is_file():
              raise SystemExit('publish_site_enhancements.py is not yet admitted')
          source = path.read_text(encoding='utf-8')

          table_start = source.index('KNOWN_REPLACEMENTS = (')
          table_end = source.index('\n)\n\n\ndef relative_asset', table_start) + 3
          table = '''KNOWN_REPLACEMENTS = (
    ("N=2^n", r"\\(N = 2^n\\)"),
    ("A_k/(N_D N_f kappa)", r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)"),
    ("A_k/(N_D N_f kappa", r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)"),
    ("A_k / (N_D N_f kappa)", r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)"),
    ("A_k / (N_D N_f kappa", r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)"),
)
'''
          source = source[:table_start] + table + source[table_end:]

          function_start = source.index('def replace_known_formulae(source: str) -> str:')
          function_end = source.index('\n\ndef enhance_page', function_start)
          function = '''def replace_known_formulae(source: str) -> str:
    # Repair legacy plain-text formulae, then collapse any nested delimiters
    # left by an older repeated build. These replacements are idempotent.
    source = source.replace("N=2^n", r"\\(N = 2^n\\)")
    for plain in (
        "A_k/(N_D N_f kappa)",
        "A_k/(N_D N_f kappa",
        "A_k / (N_D N_f kappa)",
        "A_k / (N_D N_f kappa",
    ):
        source = source.replace(plain, r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)")
    while r"\\(\\(N = 2^n\\)\\)" in source:
        source = source.replace(r"\\(\\(N = 2^n\\)\\)", r"\\(N = 2^n\\)")
    while r"\\(\\(\\frac{A_k}{N_D N_f \\kappa}\\)\\)" in source:
        source = source.replace(
            r"\\(\\(\\frac{A_k}{N_D N_f \\kappa}\\)\\)",
            r"\\(\\frac{A_k}{N_D N_f \\kappa}\\)",
        )
    return source
'''
          source = source[:function_start] + function + source[function_end:]
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Run the publisher twice and reject nested delimiters
        shell: bash
        run: |
          python3 -m py_compile website/scripts/publish_site_enhancements.py
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/static" "$tmp/case-studies/robin"
          cp website/static/site-enhancements.js website/static/site-enhancements.css "$tmp/static/"
          printf '%s\n' '<!doctype html><html><head></head><body><aside><nav></nav></aside><p>N=2^n</p><p>A_k/(N_D N_f kappa</p></body></html>' > "$tmp/case-studies/robin/index.html"
          python3 website/scripts/publish_site_enhancements.py --root "$tmp"
          python3 website/scripts/publish_site_enhancements.py --root "$tmp"
          grep -Fq '\(N = 2^n\)' "$tmp/case-studies/robin/index.html"
          grep -Fq '\frac{A_k}{N_D N_f \kappa}' "$tmp/case-studies/robin/index.html"
          ! grep -Fq '\(\(N = 2^n\)\)' "$tmp/case-studies/robin/index.html"
          ! grep -Fq '\(\(\frac{A_k}{N_D N_f \kappa}\)\)' "$tmp/case-studies/robin/index.html"

      - name: Commit and deploy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/scripts/publish_site_enhancements.py
          if ! git diff --cached --quiet; then
            git commit -m 'Harden public formula normalization against repeated builds'
            git push origin HEAD:main
          fi
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 15
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify live site and remove any remaining non-main branches
        shell: bash
        run: |
          set -euo pipefail
          base='https://dakebu.github.io/Quantum-Computing-Block-Encoding'
          for attempt in $(seq 1 30); do
            robin="$(curl -fsSL "$base/case-studies/robin/index.html" || true)"
            graph="$(curl -fsSL "$base/underlying-lean-graph/index.html" || true)"
            if printf '%s' "$robin" | grep -Fq '\(N = 2^n\)' \
              && printf '%s' "$robin" | grep -Fq '\frac{A_k}{N_D N_f \kappa}' \
              && ! printf '%s' "$robin" | grep -Fq '\(\(N = 2^n\)\)' \
              && printf '%s' "$graph" | grep -Fq 'Underlying Lean Graph of Libraries'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 10
          done
          python3 - <<'PY'
          import json
          import os
          import subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', f'repos/{repo}/branches?per_page=100', '--slurp'
          ], text=True))
          for branch in [item for page in pages for item in page]:
              if branch['name'] != 'main':
                  subprocess.run(
                      ['gh', 'api', '-X', 'DELETE', f"repos/{repo}/git/refs/heads/{branch['name']}"],
                      check=True,
                  )
          remaining = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/branches?per_page=100'
          ], text=True))
          if [branch['name'] for branch in remaining] != ['main']:
              raise SystemExit('non-main branches remain')
          print('formula rendering, Lean graph, and main-only branch state verified')
          PY
