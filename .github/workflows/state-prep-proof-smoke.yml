# catalog-regeneration child-PR trigger
name: State-preparation proof smoke

on:
  pull_request:
    paths:
      - "QuantumBlockEncoding/StatePreparationBenchmarks*.lean"
      - "QuantumBlockEncoding/StatePreparationPaperEntryCertificates.lean"
      - "QuantumBlockEncoding/StatePreparationPaperRoutes*.lean"
      - "QuantumBlockEncoding/StatePreparationPrimitiveRoutes.lean"
      - "QuantumBlockEncoding/StatePreparationBellRoute.lean"
      - "QuantumBlockEncoding/StatePreparation.lean"
      - "QuantumBlockEncoding/ConcreteSemantics.lean"
      - "QuantumBlockEncoding/TextbookStatePreparation.lean"
      - "QuantumBlockEncoding/PrimitiveCircuit.lean"
      - "QuantumBlockEncoding/PrimitiveSemantics.lean"
      - "QuantumBlockEncoding/PrimitiveBasisLE.lean"
      - "QuantumBlockEncoding/UniformlyControlledRy.lean"
      - "QuantumBlockEncoding/Circuit.lean"
      - "QuantumBlockEncoding/Resources.lean"
      - "QuantumBlockEncoding.lean"
      - "executable-exports/SP-PAPERS-001/qiskit/export.py"
      - ".github/workflows/state-prep-proof-smoke.yml"
  workflow_dispatch:

concurrency:
  group: state-prep-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  state-prep-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile representative State Preparation benchmarks
        run: lake build QuantumBlockEncoding.StatePreparationBenchmarks
      - name: Check executable Qiskit mirrors
        shell: bash
        run: |
          python3 -m pip install --quiet 'qiskit>=2,<3'
          python3 - <<'PY'
          import importlib.util
          import math
          from pathlib import Path
          path = Path('executable-exports/SP-PAPERS-001/qiskit/export.py')
          spec = importlib.util.spec_from_file_location('sp_export', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          targets = {
              'bell': ([1 / math.sqrt(2), 0, 0, 1 / math.sqrt(2)], 2, 2),
              'mottonen': ([39/169, 52/169, 60/169, 144/169], 5, 4),
              'grover-rudolph': ([9/25, 12/25, 12/25, 16/25], 2, 1),
              'sparse': ([3/13, 0, 4/13, 0, 12/13, 0, 0, 0], 5, 4),
          }
          for name, (expected, gates, depth) in targets.items():
              circuit = module.BUILDERS[name]()
              actual = list(module.Statevector.from_instruction(circuit).data)
              error = max(abs(value - target) for value, target in zip(actual, expected))
              assert error < 1e-12, (name, error, actual)
              assert circuit.size() == gates, (name, circuit.size(), gates)
              assert circuit.depth() == depth, (name, circuit.depth(), depth)
              print(f'{name}: amplitude error={error:.3e}, gates={gates}, depth={depth}')
          PY

  regenerate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Register State Preparation modules and regenerate generated evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-blueprint-catalog.py')
          text = path.read_text(encoding='utf-8')
          marker = '''            "Robin/SystemConjugation.lean",
        },
    ),'''
          replacement = '''            "Robin/SystemConjugation.lean",
            "StatePreparationBenchmarksCoreFixed.lean",
            "StatePreparationPrimitiveRoutes.lean",
            "StatePreparationBellRoute.lean",
            "StatePreparationPaperEntryCertificates.lean",
            "StatePreparationPaperRoutesCompact.lean",
            "StatePreparationPaperRoutes.lean",
            "StatePreparationBenchmarks.lean",
        },
    ),'''
          if '"StatePreparationPaperRoutesCompact.lean"' not in text:
              if marker not in text:
                  raise SystemExit('PaperAndExamples catalog marker not found')
              text = text.replace(marker, replacement, 1)
          text = text.replace(
              '"Paper-facing backend models and concrete Robin-boundary example "\n        "artifacts."',
              '"Paper-facing backend models and concrete State Preparation / Robin "\n        "example artifacts."',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/generate-blueprint-catalog.py
          python3 scripts/generate-blueprint-catalog.py --check
          git diff --check
      - name: Commit generated catalog evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-blueprint-catalog.py ABEISBlueprint/Catalog/PaperAndExamples.lean web/library/declarations.json docs/blueprint-coverage.json
          if git diff --cached --quiet; then
            echo 'Catalog already current.'
            exit 0
          fi
          git commit -m 'Regenerate library catalog for State Preparation routes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
