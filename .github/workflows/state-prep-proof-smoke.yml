concurrency:
  group: state-prep-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  state-prep-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile reversible arithmetic and interval-tree routes
        run: |
          lake build QuantumBlockEncoding.ComparatorIncrementer
          lake build QuantumBlockEncoding.ComparatorIncrementerControlledConjugation
          lake build QuantumBlockEncoding.ComparatorIncrementerDirtyAncilla
          lake build QuantumBlockEncoding.ComparatorIncrementerModularConjugation
          lake build QuantumBlockEncoding.ReversibleRegisterLift
          lake build QuantumBlockEncoding.PrimitiveBasisRegisterSplit
          lake build QuantumBlockEncoding.ReversibleSchedule
          lake build QuantumBlockEncoding.ComparatorIncrementerAllX
          lake build QuantumBlockEncoding.ComparatorIncrementerAllXResources
          lake build QuantumBlockEncoding.ComparatorIncrementerControlledAllX
          lake build QuantumBlockEncoding.ComparatorIncrementerFanoutIdentity
          lake build QuantumBlockEncoding.ComparatorIncrementerFanoutSource
          lake build QuantumBlockEncoding.ComparatorIncrementerFanoutResourceClosure
          lake build QuantumBlockEncoding.VandaeleLemma1Contract
          lake build QuantumBlockEncoding.VandaeleLemma1ProgramFamily
          lake build QuantumBlockEncoding.VandaeleLadderContract
          lake build QuantumBlockEncoding.VandaeleLemma2ProgramFamily
          lake build QuantumBlockEncoding.VandaeleLemma4ProgramFamily
          lake build QuantumBlockEncoding.VandaeleCorollary4ProgramFamily
          lake build QuantumBlockEncoding.ComparatorIncrementerGeneral
          lake build QuantumBlockEncoding.ZModPrimitiveBasisBridge
          lake build QuantumBlockEncoding.ComparatorIncrementerRecursiveSplit
          lake build QuantumBlockEncoding.ComparatorIncrementerControlledSplit
          lake build QuantumBlockEncoding.ComparatorIncrementerRecurrence
          lake build QuantumBlockEncoding.ComparatorIncrementerEq40ControlInvariant
          lake build QuantumBlockEncoding.ComparatorIncrementerEq44Semantics
          lake build QuantumBlockEncoding.ComparatorIncrementerEq36ResourceClosure
          lake build QuantumBlockEncoding.ControlledStrongPromise
          lake build QuantumBlockEncoding.PredicateControlledStrongPromise
          lake build QuantumBlockEncoding.PredicateControlledConjugation
          lake build QuantumBlockEncoding.VandaeleLemma5Contract
          lake build QuantumBlockEncoding.VandaeleLemma5Equations13_14
          lake build QuantumBlockEncoding.VandaeleLemma5SplitBudget
          lake build QuantumBlockEncoding.VandaeleLemma5ResourceClosure
          lake build QuantumBlockEncoding.VandaeleTheorem1Contract
          lake build QuantumBlockEncoding.VandaeleTheorem1ResourceClosure
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7Contract
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7BasisContract
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7Eq38Semantics
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7Eq38CleanProtocol
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7Eq38Bridge
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7FlatContract
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7PromiseBudget
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7SingleControlResourceClosure
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma7ResourceClosure
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma8Contract
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma8Budget
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma8PromiseCleanliness
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma8TwoRoundSchedule
          lake build QuantumBlockEncoding.ComparatorIncrementerLemma8Composition
          lake build QuantumBlockEncoding.ComparatorIncrementerTheorem4GateBound
          lake build QuantumBlockEncoding.ComparatorIncrementerTheorem4DepthBound
          lake build QuantumBlockEncoding.ComparatorIncrementerLowerBoundReduction
          lake build QuantumBlockEncoding.PrimitiveBasisLE4
          lake build QuantumBlockEncoding.StatePreparationIntervalTree
          lake build QuantumBlockEncoding.StatePreparationIntervalTreeEndToEnd
      - name: Compile representative State Preparation benchmarks
        run: lake build QuantumBlockEncoding.StatePreparationBenchmarks
      - name: Check executable Qiskit mirrors
        shell: bash
        run: |
          python3 -m pip install --quiet 'qiskit>=2,<3'
          python3 - <<'PY'
          import importlib.util
          import math
          from pathlib import Path

          path = Path('executable-exports/SP-PAPERS-001/qiskit/export.py')
          spec = importlib.util.spec_from_file_location('sp_export', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          targets = {
              'bell': ([1 / math.sqrt(2), 0, 0, 1 / math.sqrt(2)], 2, 2),
              'mottonen': ([39/169, 52/169, 60/169, 144/169], 5, 4),
              'grover-rudolph': ([9/25, 12/25, 12/25, 16/25], 2, 1),
              'sparse': ([3/13, 0, 4/13, 0, 12/13, 0, 0, 0], 5, 4),
          }
          for name, (expected, gates, depth) in targets.items():
              circuit = module.BUILDERS[name]()
              actual = list(module.Statevector.from_instruction(circuit).data)
              error = max(abs(value - target) for value, target in zip(actual, expected))
              assert error < 1e-12, (name, error, actual)
              assert circuit.size() == gates, (name, circuit.size(), gates)
              assert circuit.depth() == depth, (name, circuit.depth(), depth)
              print(f'{name}: amplitude error={error:.3e}, gates={gates}, depth={depth}')
          PY
