name: Vandaele comparator proof frontier

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/VandaeleComparator*.lean"
      - ".github/workflows/vandaele-comparator-contract.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-comparator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparator-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile Equation 17 comparator contract
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleComparatorContract
