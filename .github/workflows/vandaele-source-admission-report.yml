name: Vandaele source admission report

on:
  push:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/Vandaele*.lean"
      - "QuantumBlockEncoding/PromiseGate*.lean"
      - "QuantumBlockEncoding/StrongPromise*.lean"
      - "QuantumBlockEncoding/Gidney*.lean"
      - "QuantumBlockEncoding/ComparatorIncrementer*.lean"
      - "QuantumBlockEncoding/BasisIncrementAllXConjugation.lean"
      - "QuantumBlockEncoding/BinaryCarryTelescoping.lean"
      - "QuantumBlockEncoding/MixedRadixIncrement.lean"
      - "QuantumBlockEncoding/PrimitiveBasisLENumeric.lean"
      - "QuantumBlockEncoding/ReversibleProgram*.lean"
      - "QuantumBlockEncoding.lean"
      - ".github/workflows/vandaele-source-admission-report.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-source-admission-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile Vandaele source spines and write report
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p _out
          report="_out/vandaele-source-smoke-report.md"
          status_file="_out/vandaele-source-smoke-status"
          : > "$report"
          printf '# Vandaele source Lean admission report\n\n' >> "$report"
          printf -- '- commit: `%s`\n' "$GITHUB_SHA" >> "$report"
          printf -- '- workflow: `vandaele-source-admission-report.yml`\n' >> "$report"
          printf -- '- policy: each top-level spine is built by Lean; dependencies are compiled transitively.\n\n' >> "$report"

          modules=(
            QuantumBlockEncoding.PromiseGateUnitaryMux
            QuantumBlockEncoding.PromiseGatePermutationMatrixBridge
            QuantumBlockEncoding.VandaeleNaiveLadderFiniteChecks
            QuantumBlockEncoding.VandaeleStructuralPrimitivesFormalization
            QuantumBlockEncoding.VandaeleQuantumAdderFormalization
            QuantumBlockEncoding.VandaeleComparatorFormalization
            QuantumBlockEncoding.VandaeleIncrementerFormalization
            QuantumBlockEncoding.VandaeleAdderFormalization
            QuantumBlockEncoding.VandaeleShorFormalization
            QuantumBlockEncoding
          )

          overall=0
          for module in "${modules[@]}"; do
            log="$(mktemp)"
            if lake build "$module" >"$log" 2>&1; then
              printf '## PASS `%s`\n\n' "$module" >> "$report"
            else
              overall=1
              printf '## FAIL `%s`\n\n```text\n' "$module" >> "$report"
              tail -n 200 "$log" >> "$report"
              printf '\n```\n\n' >> "$report"
            fi
            rm -f "$log"
          done

          if [ "$overall" -eq 0 ]; then
            printf '## Overall: PASS\n\nAll source-spine builds were accepted by Lean.\n' >> "$report"
          else
            printf '## Overall: FAIL\n\nAt least one source-spine build failed Lean admission.\n' >> "$report"
          fi
          printf '%s\n' "$overall" > "$status_file"
          exit 0

      - name: Commit admission report to proof branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- _out/vandaele-source-smoke-report.md
          if git diff --cached --quiet; then
            echo 'Admission report unchanged.'
          else
            git commit -m '[vandaele-admission] Record Lean source spine report'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Fail workflow when Lean admission fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat _out/vandaele-source-smoke-status)" = '0'
