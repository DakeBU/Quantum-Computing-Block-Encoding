name: Fast website teaching contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  teaching-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check public figure typography and formulas
        run: python3 tools/check_public_figure_style.py

      - name: Check Python and teaching data
        run: |
          python3 -m py_compile \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/polish_casebook.py \
            website/scripts/test_casebook_enrichment.py \
            website/scripts/test_casebook_polish.py
          python3 -m unittest \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish
          python3 - <<'PY'
          from website.scripts import enrich_casebook
          from website.scripts.enforce_robin_reader_contract import robin_record, validate_data
          validate_data(robin_record(), enrich_casebook.declaration_map())
          print("Robin paper -> plain language -> Lean contract: data roots valid")
          PY

  dispatch-repository-admission:
    if: contains(github.event.head_commit.message, '[dispatch-repository-admission]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch permanent repository admission workflow
        run: gh workflow run repository-admission.yml --repo "$GITHUB_REPOSITORY" --ref main
