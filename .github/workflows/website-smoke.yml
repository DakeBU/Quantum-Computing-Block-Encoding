name: Fast website teaching contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "website/**"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  teaching-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Python, JavaScript, and teaching data
        run: |
          python3 -m py_compile \
            website/scripts/build_site.py \
            website/scripts/lean_graph.py \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/publish_extensions.py \
            website/scripts/publish_paper_pages.py \
            website/scripts/publish_taxonomy.py \
            website/scripts/polish_casebook.py \
            website/scripts/test_casebook_enrichment.py \
            website/scripts/test_casebook_polish.py
          node --check website/static/lean-graph.js
          python3 -m unittest \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish
          python3 website/scripts/publish_taxonomy.py --check-data
          python3 - <<'PY'
          import json
          from pathlib import Path
          from website.scripts import enrich_casebook
          from website.scripts.enforce_robin_reader_contract import robin_record, validate_data

          validate_data(robin_record(), enrich_casebook.declaration_map())
          state = json.loads(Path('website/state-prep-cases.json').read_text(encoding='utf-8'))
          papers = json.loads(Path('website/papers.json').read_text(encoding='utf-8'))
          anchors = json.loads(Path('website/case-source-anchors.json').read_text(encoding='utf-8'))
          teaching = json.loads(Path('website/case-teaching.json').read_text(encoding='utf-8'))
          robin = teaching['cases']['robin-ghl-one-term']
          robin_text = json.dumps(robin, ensure_ascii=False)

          assert state['schemaVersion'] == 1 and len(state['cases']) >= 4
          assert set(state['teaching']) == {case['slug'] for case in state['cases']}
          assert papers['schemaVersion'] == 1 and papers['featured'] and papers['queue']
          paper_categories = {item['category'] for item in papers['featured'] + papers['queue']}
          assert paper_categories == {'statePreparation', 'blockEncoding'}
          required = {
              'bell-state-preparation',
              'mottonen-dense-state-preparation',
              'grover-rudolph-product-state-preparation',
              'sparse-three-state-preparation',
              'robin-ghl-one-term',
          }
          assert required <= set(anchors['cases'])
          for slug in required:
              record = anchors['cases'][slug]
              assert record['paperTitle'] and record['anchorLabel'] and record['anchors']
          formalized_papers = [item for item in papers['queue'] if item['status'] != 'queued']
          assert len(formalized_papers) >= 4
          for item in formalized_papers:
              assert item['route'].startswith('papers/')
              assert item['sourceAnchors'] and item['sourceStatement']
              assert item['leanRoots']

          assert r'\(N=8\)' in robin_text
          assert r'\(A_k/(\mathcal N_D\mathcal N_f\kappa)\)' in robin_text
          assert 'A_k/(N_D N_f kappa)' not in robin_text
          assert 'Underlying Lean Graph of Libraries' in Path('website/scripts/build_site.py').read_text(encoding='utf-8')
          assert Path('website/scripts/lean_graph.py').is_file()
          assert Path('website/static/lean-graph.js').is_file()
          assert Path('website/static/lean-graph.css').is_file()
          print('Robin MathJax + Papers + State Preparation + Lean graph contract: valid')
          PY

  patch-paper-output-budgets:
    if: contains(github.event.head_commit.message, '[patch-paper-output-budgets]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/papers-state-prep
          fetch-depth: 0
      - name: Give each finite output leaf an independent local budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('QuantumBlockEncoding/StatePreparationPaperRoutes.lean')
          text = path.read_text(encoding='utf-8')
          names = [f'mottonenDenseUcry_output_{i}' for i in range(4)]
          names += [f'sparsePrunedUcry_output_{i}' for i in range(8)]
          for name in names:
              plain = f'private theorem {name} :'
              wrapped = f'set_option maxHeartbeats 1000000 in\nprivate theorem {name} :'
              if wrapped in text:
                  continue
              if plain not in text:
                  raise SystemExit(f'missing finite output leaf: {name}')
              text = text.replace(plain, wrapped, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git grep -n 'set_option maxHeartbeats 1000000 in' QuantumBlockEncoding/StatePreparationPaperRoutes.lean
      - name: Commit finite output budgets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QuantumBlockEncoding/StatePreparationPaperRoutes.lean
          git commit -m 'Bound finite paper-route output proofs locally'
          git push origin HEAD:agent/papers-state-prep
