name: Fast website teaching contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teaching-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Rebuild approved vivid hierarchy PNG on conversion branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/replace-vivid-hierarchy-png'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          cat .tmp-hierarchy/p*.b64 > /tmp/hierarchy.b64
          base64 --decode /tmp/hierarchy.b64 > docs/assets/hierarchical_harness.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path('docs/assets/hierarchical_harness.png')
          image = Image.open(path)
          image.verify()
          image = Image.open(path)
          print(f'{path}: {path.stat().st_size} bytes, {image.size[0]}x{image.size[1]}')
          assert image.size[0] == 1000, image.size
          assert path.stat().st_size < 100_000, path.stat().st_size
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/hierarchical_harness.png
          if ! git diff --cached --quiet; then
            git commit -m 'Replace hierarchy PNG with vivid illustration'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Check public figure typography and formulas
        run: python3 tools/check_public_figure_style.py

      - name: Check Python and teaching data
        run: |
          python3 -m py_compile \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/polish_casebook.py \
            website/scripts/test_casebook_enrichment.py \
            website/scripts/test_casebook_polish.py
          python3 -m unittest \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish
          python3 - <<'PY'
          from website.scripts import enrich_casebook
          from website.scripts.enforce_robin_reader_contract import robin_record, validate_data
          validate_data(robin_record(), enrich_casebook.declaration_map())
          print("Robin paper -> plain language -> Lean contract: data roots valid")
          PY
