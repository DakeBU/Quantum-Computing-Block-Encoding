name: Fast website teaching contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teaching-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply PNG hierarchy reference patch (one-shot)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "docs/assets/aspbe_hierarchical_harness.webp"
          new = "docs/assets/aspbe_hierarchical_harness.png"
          if old not in text:
              raise SystemExit(f"README does not contain expected old hierarchy reference: {old}")
          readme.write_text(text.replace(old, new), encoding="utf-8")

          guard = Path("tools/check_public_figure_style.py")
          text = guard.read_text(encoding="utf-8")
          text = text.replace("HIERARCHY_WEBP", "HIERARCHY_PNG")
          text = text.replace("aspbe_hierarchical_harness.webp", "aspbe_hierarchical_harness.png")
          text = text.replace("expected_webp_ref", "expected_png_ref")
          text = text.replace("WebP", "PNG")
          needle = '    r"\\\\mathrm{diag}",\n)'
          replacement = '    r"\\\\mathrm{diag}",\n    "aspbe_hierarchical_harness.webp",\n)'
          if needle not in text:
              raise SystemExit("Could not locate forbidden-token tuple in figure guard")
          text = text.replace(needle, replacement, 1)
          guard.write_text(text, encoding="utf-8")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md tools/check_public_figure_style.py
          git commit -m 'Use PNG hierarchy figure'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check public figure typography and formulas
        run: python3 tools/check_public_figure_style.py

      - name: Check Python and teaching data
        run: |
          python3 -m py_compile \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/polish_casebook.py \
            website/scripts/test_casebook_enrichment.py \
            website/scripts/test_casebook_polish.py
          python3 -m unittest \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish
          python3 - <<'PY'
          from website.scripts import enrich_casebook
          from website.scripts.enforce_robin_reader_contract import robin_record, validate_data
          validate_data(robin_record(), enrich_casebook.declaration_map())
          print("Robin paper -> plain language -> Lean contract: data roots valid")
          PY
