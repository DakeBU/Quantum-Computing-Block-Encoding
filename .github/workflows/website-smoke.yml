name: Fast website teaching contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "website/**"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teaching-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Python and teaching data
        run: |
          python3 -m py_compile \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/publish_extensions.py \
            website/scripts/publish_paper_pages.py \
            website/scripts/publish_taxonomy.py \
            website/scripts/polish_casebook.py \
            website/scripts/test_casebook_enrichment.py \
            website/scripts/test_casebook_polish.py
          python3 -m unittest \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish
          python3 website/scripts/publish_taxonomy.py --check-data
          python3 - <<'PY'
          import json
          from pathlib import Path
          from website.scripts import enrich_casebook
          from website.scripts.enforce_robin_reader_contract import robin_record, validate_data

          validate_data(robin_record(), enrich_casebook.declaration_map())
          state = json.loads(Path('website/state-prep-cases.json').read_text(encoding='utf-8'))
          papers = json.loads(Path('website/papers.json').read_text(encoding='utf-8'))
          anchors = json.loads(Path('website/case-source-anchors.json').read_text(encoding='utf-8'))
          assert state['schemaVersion'] == 1 and len(state['cases']) >= 4
          assert set(state['teaching']) == {case['slug'] for case in state['cases']}
          assert papers['schemaVersion'] == 1 and papers['featured'] and papers['queue']
          paper_categories = {item['category'] for item in papers['featured'] + papers['queue']}
          assert paper_categories == {'statePreparation', 'blockEncoding'}
          required = {
              'bell-state-preparation',
              'mottonen-dense-state-preparation',
              'grover-rudolph-product-state-preparation',
              'sparse-three-state-preparation',
              'robin-ghl-one-term',
          }
          assert required <= set(anchors['cases'])
          for slug in required:
              record = anchors['cases'][slug]
              assert record['paperTitle'] and record['anchorLabel'] and record['anchors']
          formalized_papers = [item for item in papers['queue'] if item['status'] != 'queued']
          assert len(formalized_papers) >= 4
          for item in formalized_papers:
              assert item['route'].startswith('papers/')
              assert item['sourceAnchors'] and item['sourceStatement']
              assert item['leanRoots']
          print('Robin + Papers + state-preparation teaching taxonomy: syntax and static structure valid')
          PY

  apply-site-graph:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/papers-state-prep
          fetch-depth: 0
      - name: Apply integrated graph and formula patch
        run: python3 tools/apply_lean_graph_patch.py
      - name: Commit integrated website
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/scripts/build_site.py \
                  website/case-teaching.json \
                  scripts/build-website.sh \
                  .github/workflows/pages.yml
          git commit -m 'Publish the underlying Lean library graph'
          git push origin HEAD:agent/papers-state-prep
