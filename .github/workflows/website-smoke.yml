name: Fast website teaching contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teaching-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check public figure typography and formulas
        run: python3 tools/check_public_figure_style.py

      - name: Check Python and teaching data
        run: |
          python3 -m py_compile \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/polish_casebook.py \
            website/scripts/test_casebook_enrichment.py \
            website/scripts/test_casebook_polish.py
          python3 -m unittest \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish
          python3 - <<'PY'
          from website.scripts import enrich_casebook
          from website.scripts.enforce_robin_reader_contract import robin_record, validate_data
          validate_data(robin_record(), enrich_casebook.declaration_map())
          print("Robin paper -> plain language -> Lean contract: data roots valid")
          PY

  patch-state-prep-linearity:
    if: contains(github.event.head_commit.message, '[patch-state-prep-linearity]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/papers-state-prep
          fetch-depth: 0
      - name: Patch heavy paper-route state action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('QuantumBlockEncoding/StatePreparationPaperRoutesFinal.lean')
          text = path.read_text()
          replacements = [
          ('''set_option maxHeartbeats 1000000 in
theorem mottonenDenseUcry_on_root :
    applyVec (evalPrimitiveCircuitLE mottonenDenseUcryCircuit) mottonenRootState =
      mottonenDenseState := by
  unfold applyVec mottonenRootState basisKet
  rw [_root_.Matrix.mulVec_add, _root_.Matrix.mulVec_smul,
    _root_.Matrix.mulVec_smul, _root_.Matrix.mulVec_single_one,
    _root_.Matrix.mulVec_single_one]
  funext row
''', '''theorem mottonenDenseUcry_on_root :
    applyVec (evalPrimitiveCircuitLE mottonenDenseUcryCircuit) mottonenRootState =
      mottonenDenseState := by
  unfold mottonenRootState
  rw [applyVec_twoBasisSuperposition]
  funext row
'''),
          ('''set_option maxHeartbeats 1000000 in
theorem sparsePrunedUcry_on_root :
    applyVec (evalPrimitiveCircuitLE sparsePrunedUcryCircuit) sparseRootState =
      sparseThreeState := by
  unfold applyVec sparseRootState basisKet
  rw [_root_.Matrix.mulVec_add, _root_.Matrix.mulVec_smul,
    _root_.Matrix.mulVec_smul, _root_.Matrix.mulVec_single_one,
    _root_.Matrix.mulVec_single_one]
  funext row
''', '''theorem sparsePrunedUcry_on_root :
    applyVec (evalPrimitiveCircuitLE sparsePrunedUcryCircuit) sparseRootState =
      sparseThreeState := by
  unfold sparseRootState
  rw [applyVec_twoBasisSuperposition]
  funext row
''')]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected heavy proof block not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit patch to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QuantumBlockEncoding/StatePreparationPaperRoutesFinal.lean
          git commit -m 'Use compiled sparse linearity in paper routes'
          git push origin HEAD:agent/papers-state-prep
