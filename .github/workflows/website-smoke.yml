name: Fast website teaching contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "website/**"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  teaching-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check Python, JavaScript, and teaching data
        run: |
          python3 -m py_compile website/scripts/build_site.py website/scripts/lean_graph.py website/scripts/enrich_casebook.py website/scripts/enforce_robin_reader_contract.py website/scripts/publish_extensions.py website/scripts/publish_paper_pages.py website/scripts/publish_taxonomy.py website/scripts/polish_casebook.py
          node --check website/static/lean-graph.js
          python3 -m unittest website.scripts.test_casebook_enrichment website.scripts.test_casebook_polish
          python3 website/scripts/publish_taxonomy.py --check-data

  patch-paper-output-congr:
    if: contains(github.event.head_commit.message, '[patch-paper-output-congr]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/papers-state-prep
          fetch-depth: 0
      - name: Replace output-leaf rewrites by congrArg₂
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('QuantumBlockEncoding/StatePreparationPaperRoutes.lean')
          text = path.read_text(encoding='utf-8')
          pairs = {
              'mottonenDenseUcry_output_0': ('mottonenDenseUcry_entry_00', 'mottonenDenseUcry_entry_02'),
              'mottonenDenseUcry_output_1': ('mottonenDenseUcry_entry_10', 'mottonenDenseUcry_entry_12'),
              'mottonenDenseUcry_output_2': ('mottonenDenseUcry_entry_20', 'mottonenDenseUcry_entry_22'),
              'mottonenDenseUcry_output_3': ('mottonenDenseUcry_entry_30', 'mottonenDenseUcry_entry_32'),
              'sparsePrunedUcry_output_0': ('sparsePrunedUcry_entry_00', 'sparsePrunedUcry_entry_04'),
              'sparsePrunedUcry_output_1': ('sparsePrunedUcry_entry_10', 'sparsePrunedUcry_entry_14'),
              'sparsePrunedUcry_output_2': ('sparsePrunedUcry_entry_20', 'sparsePrunedUcry_entry_24'),
              'sparsePrunedUcry_output_3': ('sparsePrunedUcry_entry_30', 'sparsePrunedUcry_entry_34'),
              'sparsePrunedUcry_output_4': ('sparsePrunedUcry_entry_40', 'sparsePrunedUcry_entry_44'),
              'sparsePrunedUcry_output_5': ('sparsePrunedUcry_entry_50', 'sparsePrunedUcry_entry_54'),
              'sparsePrunedUcry_output_6': ('sparsePrunedUcry_entry_60', 'sparsePrunedUcry_entry_64'),
              'sparsePrunedUcry_output_7': ('sparsePrunedUcry_entry_70', 'sparsePrunedUcry_entry_74'),
          }
          for name, (left, right) in pairs.items():
              text = text.replace(
                  f'set_option maxHeartbeats 1000000 in\nprivate theorem {name} :',
                  f'private theorem {name} :',
                  1,
              )
              old = f'  rw [{left}, {right}]\n  norm_num'
              new = (
                  '  exact\n'
                  '    (congrArg₂\n'
                  '      (fun x y : ℂ => (5 / 13 : ℂ) * x + (12 / 13 : ℂ) * y)\n'
                  f'      {left} {right}).trans (by norm_num)'
              )
              if old not in text:
                  raise SystemExit(f'expected rewrite block missing for {name}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          ! git grep -n 'maxHeartbeats 1000000' QuantumBlockEncoding/StatePreparationPaperRoutes.lean
          git grep -n 'congrArg₂' QuantumBlockEncoding/StatePreparationPaperRoutes.lean
      - name: Commit direct-congruence output proofs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QuantumBlockEncoding/StatePreparationPaperRoutes.lean
          git commit -m 'Avoid heavy rewrites in paper-route output proofs'
          git push origin HEAD:agent/papers-state-prep

  monitor-state-prep-head:
    if: contains(github.event.head_commit.message, '[monitor-state-prep-head]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Watch direct branch admission run
        shell: bash
        run: |
          sleep 8
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow state-prep-proof-smoke.yml --branch agent/papers-state-prep --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body "Direct candidate State Preparation admission run: **${run_id}**. It compiles the branch head and then checks all four Qiskit mirrors."
          set +e
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          code=$?
          set -e
          status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url)"
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body "Direct State Preparation admission **${run_id}** finished: \`${status}\` (exit ${code})."
          exit "$code"
