name: Fast website teaching contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - "docs/assets/**"
      - "matplotlibrc"
      - "tools/check_public_figure_style.py"
      - "scripts/build-website.sh"
      - ".github/workflows/website-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teaching-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply stable SVG hierarchy reference
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = 'docs/assets/aspbe_hierarchical_harness_display.jpg'
          new = 'docs/assets/aspbe_hierarchical_harness_v4.svg'
          if old not in text:
              raise SystemExit(f"missing README hierarchy reference: {old}")
          readme.write_text(text.replace(old, new), encoding="utf-8")

          guard = Path("tools/check_public_figure_style.py")
          source = guard.read_text(encoding="utf-8")
          source = source.replace(
              'HIERARCHY_JPEG = ROOT / "docs" / "assets" / "aspbe_hierarchical_harness_display.jpg"',
              'HIERARCHY_SVG = ROOT / "docs" / "assets" / "aspbe_hierarchical_harness_v4.svg"',
          )
          source = source.replace(
              "    'src=\"docs/assets/aspbe_hierarchical_harness.png\"',\n",
              "    'src=\"docs/assets/aspbe_hierarchical_harness.png\"',\n    'src=\"docs/assets/aspbe_hierarchical_harness_display.jpg\"',\n",
          )
          old_block = '''    expected_jpeg_ref = 'src="docs/assets/aspbe_hierarchical_harness_display.jpg"'\n    if expected_jpeg_ref not in readme:\n        fail("README must use the stable JPEG hierarchy figure")\n    if not HIERARCHY_JPEG.is_file():\n        fail("missing hierarchy JPEG")\n    size = HIERARCHY_JPEG.stat().st_size\n    if size > 300_000:\n        fail(f"hierarchy JPEG is too large for the README: {size} bytes > 300000")\n    if not HIERARCHY_JPEG.read_bytes().startswith(b"\\xff\\xd8\\xff"):\n        fail("hierarchy display asset is not a standard JPEG file")\n'''
          new_block = '''    expected_svg_ref = 'src="docs/assets/aspbe_hierarchical_harness_v4.svg"'\n    if expected_svg_ref not in readme:\n        fail("README must use the stable vector hierarchy figure")\n    if not HIERARCHY_SVG.is_file():\n        fail("missing hierarchy SVG")\n    size = HIERARCHY_SVG.stat().st_size\n    if size > 50_000:\n        fail(f"hierarchy SVG is too large for the README: {size} bytes > 50000")\n'''
          if old_block not in source:
              raise SystemExit("could not locate old hierarchy guard block")
          guard.write_text(source.replace(old_block, new_block), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tools/check_public_figure_style.py
          if ! git diff --cached --quiet; then
            git commit -m "Use stable vector hierarchy figure"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check public figure typography and formulas
        run: python3 tools/check_public_figure_style.py

      - name: Check Python and teaching data
        run: |
          python3 -m py_compile \
            website/scripts/enrich_casebook.py \
            website/scripts/enforce_robin_reader_contract.py \
            website/scripts/polish_casebook.py \
            website/scripts/test_casebook_enrichment.py \
            website/scripts/test_casebook_polish.py
          python3 -m unittest \
            website.scripts.test_casebook_enrichment \
            website.scripts.test_casebook_polish
          python3 - <<'PY'
          from website.scripts import enrich_casebook
          from website.scripts.enforce_robin_reader_contract import robin_record, validate_data
          validate_data(robin_record(), enrich_casebook.declaration_map())
          print("Robin paper -> plain language -> Lean contract: data roots valid")
          PY
