name: Vandaele ladder permutation compatibility frontier

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/VandaeleLadderContract.lean"
      - "QuantumBlockEncoding/VandaeleLadderPermutation.lean"
      - "QuantumBlockEncoding/VandaeleLadderRefinement.lean"
      - "QuantumBlockEncoding/VandaeleVOperator.lean"
      - ".github/workflows/vandaele-ladder-permutation-repair.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-ladder-permutation-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  permutation-voperator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile permutation and V operator
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleLadderPermutation
          lake build QuantumBlockEncoding.VandaeleVOperator
