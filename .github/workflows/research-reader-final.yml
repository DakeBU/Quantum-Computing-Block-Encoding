name: Research final reader replay
on:
  push:
    branches: ["agent/structure-atlas-stateprepwiki-20260915"]
    paths: [".github/workflows/research-reader-final.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: research-final-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    if: github.ref == 'refs/heads/agent/structure-atlas-stateprepwiki-20260915'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/structure-atlas-stateprepwiki-20260915
      - name: Apply audited reader and evidence-integrity refinements
        run: |
          set -euo pipefail
          python3 website/scripts/finalize_research_reader.py
          python3 -m unittest website.scripts.test_research_atlas tools.test_powershell_builds
          node --check website/static/research-delta.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/scripts/research_atlas.py website/scripts/test_research_browser.py website/scripts/check_research_publications.py website/scripts/test_research_atlas.py
          if ! git diff --cached --quiet; then
            git commit -m 'Bind independent review outputs and publish inspectable contribution deltas'
            git push origin HEAD:agent/structure-atlas-stateprepwiki-20260915
          fi
      - name: Wait for the actual complete proof-tree replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            status="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/34944000096 --jq .status)"
            if test "$status" = completed; then break; fi
            sleep 15
          done
          test "$status" = completed
          gh run download 34944000096 --repo "$GITHUB_REPOSITORY" --name research-site-and-browser --dir _proof-replay
      - name: Verify exact proof-input equality before reusing its proof artifacts
        run: |
          python3 - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path
          from website.scripts.proof_inputs import proof_input_digest, lean_module_targets
          source = Path('_proof-replay/_out/lean-gate.json')
          if not source.is_file():
              raise SystemExit('The actual replay did not produce a Lean gate; no inherited success is permitted.')
          gate = json.loads(source.read_text())
          if not gate.get('passed') or gate.get('proofInputsSha256') != proof_input_digest(Path('.')) or gate.get('compiledModules') != lean_module_targets(Path('.')):
              raise SystemExit('The source/configuration hashes and complete compiled inventory must match a passed real Lean gate.')
          blueprint = Path('_proof-replay/_out/blueprint')
          if not (blueprint / 'html-multi/index.html').is_file():
              raise SystemExit('The complete real Blueprint artifact is also required.')
          origin = gate['commit']
          gate['commit'] = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          gate['proofTreeVerifiedAtCommit'] = origin
          gate['inheritanceReason'] = 'Reader replay: unchanged complete Lean/configuration hash and module inventory. Real Lean execution remains at the recorded proofTreeVerifiedAtCommit; no new execution is claimed.'
          Path('_out').mkdir(exist_ok=True)
          Path('_out/lean-gate.json').write_text(json.dumps(gate, indent=2) + '\n')
          shutil.copytree(blueprint, '_out/blueprint', dirs_exist_ok=True)
          print('Inherited identical proof inputs from actual replay commit', origin)
          PY
      - name: Install executable replay dependencies
        run: python3 -m pip install -r requirements-executable.txt
      - name: Rebuild every reader page and run the complete website/browser gates
        env:
          ASPBE_PUBLICATION_BASE: 8ac04215547dcb7c40deb18b54450b03c3f6f4f6
        run: |
          set -o pipefail
          mkdir -p _out/research-diagnostics
          bash scripts/build-website.sh 2>&1 | tee _out/research-diagnostics/reader.log
      - name: Upload actual rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-final-reader-evidence
          path: |
            _site
            _out/research-browser
            _out/research-diagnostics
            _out/lean-gate.json
          if-no-files-found: warn
          retention-days: 7
