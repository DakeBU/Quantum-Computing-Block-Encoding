name: Vandaele Nie Step 3 state semantics

on:
  push:
    branches:
      - 'work/vandaele-nie-recursion-integration-*'
    paths:
      - 'QuantumBlockEncoding/VandaeleLemma1NieStepThreeStateSemantics.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NiePublicLogic.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieFixedSemantics.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieLayout.lean'
      - '.github/workflows/vandaele-nie-step-three-state-semantics.yml'
  pull_request:
    paths:
      - 'QuantumBlockEncoding/VandaeleLemma1NieStepThreeStateSemantics.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NiePublicLogic.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieFixedSemantics.lean'
      - 'QuantumBlockEncoding/VandaeleLemma1NieLayout.lean'
      - '.github/workflows/vandaele-nie-step-three-state-semantics.yml'

permissions:
  contents: read

jobs:
  nie-step-three-state-semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile Step 3 whole-state semantics
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.VandaeleLemma1NieStepThreeStateSemantics
