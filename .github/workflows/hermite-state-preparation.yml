name: Hermite state-preparation gate

on:
  push:
    branches: ["main", "agent/hermite-smooth-state-preparation-20260909"]
  pull_request:
    paths:
      - "QuantumBlockEncoding/Hermite*.lean"
      - "QuantumBlockEncoding/RealAmplitudePreparation.lean"
      - "QuantumBlockEncoding/PrimitiveCircuit.lean"
      - "QuantumBlockEncoding/UniformlyControlledRy.lean"
      - "ABEISTests/**"
      - "Tests.lean"
      - "QuantumBlockEncoding.lean"
      - "requirements-executable.txt"
      - "executable-exports/SP-HERMITE-001/**"
      - "tools/*hermite*"
      - "website/hermite-case.json"
      - "docs/hermite-state-preparation.tex"
      - ".github/workflows/hermite-state-preparation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermite-state-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require the complete Hermite source packet
        run: |
          python3 -m unittest tools.test_hermite_artifacts website.scripts.test_proof_inputs website.scripts.test_hermite_case website.scripts.test_lean_publication_gate
          python3 tools/check_hermite_artifacts.py
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Compile the state-preparation frontier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out/hermite
          lake build QuantumBlockEncoding.HermiteStatePreparation 2>&1 | tee _out/hermite/lean.log
          lake build 2>&1 | tee -a _out/hermite/lean.log
          lake build Tests 2>&1 | tee -a _out/hermite/lean.log
          python3 tools/check_proof_trust.py
      - name: Replay the Hermite executable
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-executable.txt
          python3 executable-exports/SP-HERMITE-001/qiskit/export.py --self-test
          python3 executable-exports/SP-HERMITE-001/qiskit/replay.py
