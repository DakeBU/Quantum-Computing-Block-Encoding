name: Primitive basis little-endian Lean 4.29 compatibility

on:
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/PrimitiveBasisLE.lean"
      - "QuantumBlockEncoding/PrimitiveBasisRegisterSplit.lean"
      - ".github/workflows/primitive-basis-le-lean429.yml"
  workflow_dispatch:

concurrency:
  group: primitive-basis-le-lean429-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  basis-arithmetic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile little-endian basis layer
        run: lake build QuantumBlockEncoding.PrimitiveBasisLE

      - name: Compile register-split consumer
        run: lake build QuantumBlockEncoding.PrimitiveBasisRegisterSplit
