name: Vandaele alpha semantic frontier

on:
  push:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/MultiControlledXSchedule.lean"
      - "QuantumBlockEncoding/MultiControlledXEmbedding.lean"
      - "QuantumBlockEncoding/MultiControlledXScheduleSemantics.lean"
      - "QuantumBlockEncoding/MultiControlledXLayerSemantics.lean"
      - "QuantumBlockEncoding/RemaudVandaeleLadderAlpha*.lean"
      - ".github/workflows/vandaele-alpha-semantics-smoke.yml"
  pull_request:
    branches:
      - "codex/sp-papers-comparator-proof-cost"
    paths:
      - "QuantumBlockEncoding/MultiControlledXSchedule.lean"
      - "QuantumBlockEncoding/MultiControlledXEmbedding.lean"
      - "QuantumBlockEncoding/MultiControlledXScheduleSemantics.lean"
      - "QuantumBlockEncoding/MultiControlledXLayerSemantics.lean"
      - "QuantumBlockEncoding/RemaudVandaeleLadderAlpha*.lean"
      - ".github/workflows/vandaele-alpha-semantics-smoke.yml"
  workflow_dispatch:

concurrency:
  group: vandaele-alpha-semantics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alpha-semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Compile complete Equation-7 semantic DAG
        run: |
          set -euxo pipefail
          lake build QuantumBlockEncoding.RemaudVandaeleLadderAlphaSemanticFrontier
