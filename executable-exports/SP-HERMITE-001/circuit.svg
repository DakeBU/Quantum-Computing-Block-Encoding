<text x="38" y="88" class="body" >k = 1  ·  n = 3 qubits  ·  L = 1  ·  8 grid samples  ·  chronological order: left → right</text>
<text x="38" y="119" class="small" >q₀ is the least-significant bit. Basis indices are read qₙ₋₁ … q₁q₀. RY and CNOT only; no ancillas or oracle calls.</text>
