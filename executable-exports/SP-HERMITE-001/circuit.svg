<text x="38" y="471" class="label" >HOW THE CIRCUIT BUILDS THE STATE</text>
<text x="38" y="503" class="body" >M_d(s) = sum of f_j² over j mod 2^d = s;  θ_d,s = 2 atan2(√M_{d+1}(s+2^d), √M_{d+1}(s)).</text>
<text x="38" y="531" class="body" >After stage d, the lowest d+1 wires encode √(M_{d+1}(s)/M₀); all higher wires are still |0⟩.</text>
<text x="38" y="559" class="body" >After the last stage: |0…0⟩ → Σ_j f_j / √(Σ_i f_i²) |j⟩. Each control is preserved by its controlled gate.</text>
<text x="38" y="597" class="label" >READ THE GATES</text>
<text x="38" y="625" class="body" >RY(θ)|0⟩ = cos(θ/2)|0⟩ + sin(θ/2)|1⟩. A filled dot controls the ⊕ target; it flips only for control bit 1.</text>
<text x="38" y="653" class="body" >All wires are data outputs. There is no separate carry/flag path. Zero-mass branches use θ=0 and remain unreachable.</text>
<text x="38" y="691" class="label" >NAMED FORMAL INTERFACE</text>
<text x="38" y="719" class="mono" >QuantumBlockEncoding.compileUniformlyControlledRy_eval_controlledRyBlockMatrix</text>
<text x="38" y="745" class="small" >This theorem certifies the exact recursive multiplexor. The full state-preparation theorem is linked from the case page.</text>
<text x="38" y="777" class="small" >Numbers shown on this figure are rounded. OpenQASM retains 17 significant digits; finite NumPy/Qiskit replay checks the export.</text>
<text x="38" y="802" class="small" >Reference counts: 7 RY + 8 CNOT. Exact symbolic claims require the separate repository Lean gate.</text>
</svg>
