<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="530" viewBox="0 0 1500 530" role="img" aria-labelledby="title desc">
  <title id="title">Block Encoding as a clean projected block</title>
  <desc id="desc">A larger unitary contains the scaled target operator in the block selected by clean ancilla input and output states.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#404040"/></marker>
  </defs>
  <style>
    text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
    .title { font-size: 34px; font-weight: 700; }
    .head { font-size: 23px; font-weight: 700; }
    .formula { font-size: 29px; }
    .body { font-size: 18px; fill: #3f3f3f; }
    .small { font-size: 16px; fill: #5a5a5a; }
    .matrix { fill: #fff; stroke: #4f4f4f; stroke-width: 1.5; }
    .clean { fill: #edf3f7; stroke: #48667d; stroke-width: 2; }
    .contract { fill: #fff; stroke: #48667d; stroke-width: 1.7; }
    .rule { stroke: #d2d2d2; stroke-width: 1.1; }
    .arrow { stroke: #404040; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .brace { stroke: #48667d; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="1500" height="530" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">Block Encoding — certify the clean block of a larger unitary</text>
  <text x="750" y="82" text-anchor="middle" class="small">The clean ancilla convention fixes the selected block; normalization α and tolerance ε belong to the theorem contract.</text>

  <text x="155" y="170" text-anchor="middle" class="head">Clean ancilla input</text>
  <text x="155" y="238" text-anchor="middle" class="formula">|0ᵃ⟩ ⊗ |j⟩</text>
  <text x="155" y="276" text-anchor="middle" class="body">signal input j</text>
  <path d="M285 245 L390 245" class="arrow"/>

  <text x="665" y="126" text-anchor="middle" class="head">Unitary U</text>
  <text x="665" y="154" text-anchor="middle" class="small">acts on ancilla + signal registers</text>
  <text x="550" y="184" text-anchor="middle" class="small">clean output ancilla = 0ᵃ</text>

  <rect x="420" y="198" width="520" height="250" class="matrix"/>
  <rect x="420" y="198" width="230" height="112" class="clean"/>
  <line x1="650" y1="198" x2="650" y2="448" class="rule"/>
  <line x1="790" y1="198" x2="790" y2="448" class="rule"/>
  <line x1="420" y1="310" x2="940" y2="310" class="rule"/>
  <line x1="420" y1="378" x2="940" y2="378" class="rule"/>
  <text x="535" y="252" text-anchor="middle" class="formula">A / α</text>
  <text x="535" y="285" text-anchor="middle" class="small">clean block</text>
  <text x="715" y="255" text-anchor="middle" class="body">⋯</text>
  <text x="865" y="255" text-anchor="middle" class="body">⋯</text>
  <text x="535" y="350" text-anchor="middle" class="body">⋮</text>
  <text x="715" y="350" text-anchor="middle" class="body">unitary completion</text>
  <text x="865" y="350" text-anchor="middle" class="body">⋮</text>
  <text x="680" y="422" text-anchor="middle" class="body">remaining completion blocks</text>
  <path d="M420 190 L650 190" class="brace"/>
  <path d="M410 198 L410 310" class="brace"/>
  <text x="392" y="254" text-anchor="middle" transform="rotate(-90 392 254)" class="small">clean input ancilla = 0ᵃ</text>

  <path d="M965 245 L1040 245" class="arrow"/>

  <rect x="1060" y="155" width="385" height="293" rx="4" class="contract"/>
  <text x="1252" y="196" text-anchor="middle" class="head">Certified contract</text>
  <text x="1252" y="254" text-anchor="middle" class="formula">Π U Π† = A / α</text>
  <text x="1252" y="307" text-anchor="middle" class="formula">‖A − α Π U Π†‖ ≤ ε</text>
  <line x1="1100" y1="332" x2="1405" y2="332" class="rule"/>
  <text x="1252" y="365" text-anchor="middle" class="body">register layout fixed</text>
  <text x="1252" y="396" text-anchor="middle" class="body">U unitary</text>
  <text x="1252" y="427" text-anchor="middle" class="small">named Lean root + resource record</text>

  <text x="680" y="492" text-anchor="middle" class="small">Projecting clean ancillas on both sides selects exactly the highlighted signal block.</text>
</svg>
