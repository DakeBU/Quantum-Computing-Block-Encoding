<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">State Preparation as a first-column certificate</title>
  <desc id="desc">The all-zero basis vector selects the first column of a unitary U, which must equal the target state.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#404040"/></marker>
  </defs>
  <style>
    text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
    .title { font-size: 32px; font-weight: 700; }
    .head { font-size: 22px; font-weight: 700; }
    .formula { font-size: 30px; }
    .body { font-size: 18px; fill: #3f3f3f; }
    .small { font-size: 16px; fill: #5a5a5a; }
    .matrix { fill: #fff; stroke: #4f4f4f; stroke-width: 1.5; }
    .highlight { fill: #eef6f1; stroke: #466b5a; stroke-width: 1.8; }
    .arrow { stroke: #404040; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .rule { stroke: #d2d2d2; stroke-width: 1.2; }
  </style>
  <rect width="1400" height="430" fill="#fff"/>
  <text x="700" y="48" text-anchor="middle" class="title">State Preparation — the first column is the certificate</text>
  <text x="700" y="80" text-anchor="middle" class="small">For an n-qubit target, U acts on the full 2ⁿ-dimensional space, but the preparation equation selects one column.</text>

  <text x="95" y="142" class="head">Input basis state</text>
  <text x="160" y="216" text-anchor="middle" class="formula">|0ⁿ⟩</text>
  <text x="160" y="252" text-anchor="middle" class="body">basis index 0</text>

  <path d="M245 220 L335 220" class="arrow"/>

  <text x="540" y="135" text-anchor="middle" class="head">Unitary U</text>
  <rect x="355" y="155" width="380" height="205" class="matrix"/>
  <rect x="355" y="155" width="76" height="205" class="highlight"/>
  <line x1="431" y1="155" x2="431" y2="360" class="rule"/>
  <line x1="507" y1="155" x2="507" y2="360" class="rule"/>
  <line x1="583" y1="155" x2="583" y2="360" class="rule"/>
  <line x1="659" y1="155" x2="659" y2="360" class="rule"/>
  <line x1="355" y1="196" x2="735" y2="196" class="rule"/>
  <line x1="355" y1="237" x2="735" y2="237" class="rule"/>
  <line x1="355" y1="278" x2="735" y2="278" class="rule"/>
  <line x1="355" y1="319" x2="735" y2="319" class="rule"/>
  <text x="393" y="181" text-anchor="middle" class="body">ψ₀</text>
  <text x="393" y="222" text-anchor="middle" class="body">ψ₁</text>
  <text x="393" y="263" text-anchor="middle" class="body">ψ₂</text>
  <text x="393" y="304" text-anchor="middle" class="body">⋮</text>
  <text x="393" y="345" text-anchor="middle" class="body">ψ₂ⁿ₋₁</text>
  <text x="469" y="263" text-anchor="middle" class="body">⋯</text>
  <text x="545" y="263" text-anchor="middle" class="body">⋯</text>
  <text x="621" y="263" text-anchor="middle" class="body">⋯</text>
  <text x="697" y="263" text-anchor="middle" class="body">⋯</text>
  <text x="545" y="389" text-anchor="middle" class="small">highlighted column = target amplitudes</text>

  <path d="M760 220 L855 220" class="arrow"/>

  <text x="1105" y="142" text-anchor="middle" class="head">Certified output</text>
  <text x="1105" y="205" text-anchor="middle" class="formula">U |0ⁿ⟩ = |ψ⟩</text>
  <text x="1105" y="251" text-anchor="middle" class="body">target normalized</text>
  <text x="1105" y="282" text-anchor="middle" class="body">U unitary</text>
  <text x="1105" y="313" text-anchor="middle" class="body">first-column/state-action equality</text>
  <text x="1105" y="352" text-anchor="middle" class="small">named Lean certificate + circuit/resource record</text>
</svg>
