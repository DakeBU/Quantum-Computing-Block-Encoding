<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From manual quantum construction to the ASPBE hierarchical harness</title>
  <desc id="desc">A three-panel comparison of human trial and error, flat monolithic automation, and the ASPBE Upper-Middle-Lower hierarchy with a separate reviewer and domain memory.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#383838"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4d7448"/></marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b36f26"/></marker>
  </defs>
  <style>
    text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
    .title { font-size: 42px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #555; }
    .panel-title { font-size: 29px; font-weight: 700; }
    .head { font-size: 22px; font-weight: 700; }
    .body { font-size: 16px; fill: #3f3f3f; }
    .small { font-size: 14px; fill: #5d5d5d; }
    .tiny { font-size: 12px; fill: #5d5d5d; }
    .panel { stroke-width: 1.8; rx: 22; }
    .human-panel { fill: #fffdfa; stroke: #c77b36; }
    .flat-panel { fill: #fbfcff; stroke: #587ba9; }
    .aspbe-panel { fill: #fbfdf9; stroke: #66894d; }
    .peach { fill: #fae7d7; stroke: #9b6e4c; stroke-width: 1.4; rx: 10; }
    .green { fill: #edf5e8; stroke: #66894d; stroke-width: 1.4; rx: 10; }
    .blue { fill: #edf3fa; stroke: #587ba9; stroke-width: 1.4; rx: 10; }
    .gold { fill: #fbf4df; stroke: #aa8438; stroke-width: 1.4; rx: 10; }
    .purple { fill: #f3edf9; stroke: #84699b; stroke-width: 1.4; rx: 10; }
    .rose { fill: #f9ece9; stroke: #a8675d; stroke-width: 1.4; rx: 10; }
    .white { fill: #fff; stroke: #777; stroke-width: 1.2; rx: 9; }
    .dash { fill: #fff; stroke: #999; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 12; }
    .arrow { fill: none; stroke: #383838; stroke-width: 1.6; marker-end: url(#arrow); }
    .green-arrow { fill: none; stroke: #4d7448; stroke-width: 1.6; marker-end: url(#greenArrow); }
    .orange-arrow { fill: none; stroke: #b36f26; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#orangeArrow); }
    .wire { stroke: #303030; stroke-width: 1.4; }
    .muted-wire { stroke: #7b7b7b; stroke-width: 1.1; }
  </style>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="52" text-anchor="middle" class="title">From manual quantum construction to the ASPBE hierarchical harness</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">State Preparation and Block Encoding need mathematical ideas, proof search, and disciplined verification.</text>

  <!-- panels -->
  <rect x="20" y="115" width="465" height="735" class="panel human-panel"/>
  <rect x="502" y="115" width="430" height="735" class="panel flat-panel"/>
  <rect x="949" y="115" width="631" height="735" class="panel aspbe-panel"/>

  <text x="252" y="154" text-anchor="middle" class="panel-title">(a) Human</text>
  <text x="717" y="154" text-anchor="middle" class="panel-title">(b) Flat automation</text>
  <text x="1264" y="154" text-anchor="middle" class="panel-title">(c) ASPBE hierarchical harness</text>

  <!-- Human panel -->
  <rect x="120" y="182" width="265" height="64" class="peach"/>
  <text x="252" y="222" text-anchor="middle" class="head">Problem</text>
  <path d="M252 246 L252 284" class="arrow"/>

  <!-- human icon -->
  <circle cx="145" cy="350" r="28" fill="#f3dfcf" stroke="#6e594a" stroke-width="1.3"/>
  <path d="M113 425c6-47 20-66 32-66s26 19 32 66" fill="#f3dfcf" stroke="#6e594a" stroke-width="1.3"/>
  <path d="M128 346h10M152 346h10M138 346h14" class="muted-wire"/>
  <rect x="98" y="421" width="115" height="15" rx="4" fill="#fff" stroke="#555"/>
  <rect x="155" y="308" width="165" height="150" fill="#fff" stroke="#6e594a" stroke-width="1.3" transform="rotate(-2 237 383)"/>
  <text x="237" y="338" text-anchor="middle" class="body">|ψ⟩ = Σᵢ cᵢ |i⟩</text>
  <text x="237" y="374" text-anchor="middle" class="body">U†U = I</text>
  <text x="237" y="408" text-anchor="middle" class="body">clean block = A / α</text>
  <line x1="338" y1="320" x2="438" y2="320" class="wire"/><line x1="338" y1="350" x2="438" y2="350" class="wire"/><line x1="338" y1="380" x2="438" y2="380" class="wire"/>
  <circle cx="368" cy="320" r="5" fill="#303030"/><circle cx="398" cy="350" r="5" fill="#303030"/><circle cx="420" cy="380" r="5" fill="#303030"/><line x1="398" y1="350" x2="398" y2="380" class="wire"/>
  <text x="252" y="500" text-anchor="middle" class="head" fill="#9b5a2f">Trial &amp; error</text>
  <path d="M252 516 L252 580" class="arrow"/>
  <rect x="70" y="592" width="365" height="125" class="green"/>
  <text x="252" y="638" text-anchor="middle" class="head">Construction</text>
  <text x="252" y="674" text-anchor="middle" class="body">state preparation / block encoding</text>
  <path d="M70 650 C38 650 42 515 94 500" class="arrow"/>
  <text x="252" y="784" text-anchor="middle" class="small">One mathematician carries ideas, proof search, checking, and repair.</text>

  <!-- Flat panel -->
  <rect x="585" y="182" width="265" height="64" class="peach"/>
  <text x="717" y="222" text-anchor="middle" class="head">Problem</text>
  <path d="M717 246 L717 293" class="arrow"/>
  <circle cx="717" cy="382" r="82" fill="#eef4fb" stroke="#587ba9" stroke-width="1.6"/>
  <text x="717" y="370" text-anchor="middle" class="head">LLM / solver</text>
  <text x="717" y="402" text-anchor="middle" class="body">monolithic search</text>
  <circle cx="691" cy="431" r="4" fill="#587ba9"/><circle cx="717" cy="421" r="4" fill="#587ba9"/><circle cx="742" cy="433" r="4" fill="#587ba9"/><line x1="695" y1="429" x2="713" y2="423" class="muted-wire"/><line x1="721" y1="423" x2="738" y2="431" class="muted-wire"/>
  <rect x="826" y="332" width="82" height="98" class="purple"/>
  <text x="867" y="365" text-anchor="middle" class="body">data /</text><text x="867" y="389" text-anchor="middle" class="body">prompts</text>
  <path d="M826 382 L805 382" class="arrow"/>
  <path d="M717 464 L717 515" class="arrow"/>
  <rect x="535" y="530" width="364" height="207" class="dash"/>
  <text x="717" y="558" text-anchor="middle" class="small">candidate constructions / proofs (mixed together)</text>
  <rect x="555" y="582" width="100" height="112" class="green"/>
  <text x="605" y="615" text-anchor="middle" class="body">Candidate A</text><text x="605" y="645" text-anchor="middle" class="small">SP / BE route</text>
  <line x1="574" y1="668" x2="636" y2="668" class="wire"/><circle cx="590" cy="668" r="4" fill="#333"/><circle cx="620" cy="668" r="4" fill="#333"/>
  <rect x="666" y="582" width="100" height="112" class="gold"/>
  <text x="716" y="615" text-anchor="middle" class="body">Candidate B</text><text x="716" y="645" text-anchor="middle" class="small">proof sketch</text><path d="M692 664h48M692 676h38" class="muted-wire"/>
  <rect x="777" y="582" width="100" height="112" class="rose"/>
  <text x="827" y="615" text-anchor="middle" class="body">Candidate C</text><text x="827" y="645" text-anchor="middle" class="small">fails checks</text><circle cx="827" cy="672" r="13" fill="none" stroke="#a8675d"/><path d="M818 663l18 18M836 663l-18 18" stroke="#a8675d" stroke-width="1.7"/>
  <text x="717" y="782" text-anchor="middle" class="small">Mixed tasks and weak coordination can repeat work or blur evidence boundaries.</text>

  <!-- ASPBE panel -->
  <rect x="1130" y="178" width="268" height="52" class="peach"/>
  <text x="1264" y="211" text-anchor="middle" class="head">Problem</text>
  <path d="M1264 230 L1264 252" class="green-arrow"/>

  <!-- Upper -->
  <rect x="1095" y="258" width="338" height="76" class="green"/>
  <text x="1120" y="283" class="small">UPPER</text>
  <text x="1264" y="292" text-anchor="middle" class="head">Strategist</text>
  <text x="1264" y="318" text-anchor="middle" class="body">brainstorm construction families · choose policy rung</text>
  <path d="M1264 334 L1264 354" class="green-arrow"/>

  <!-- Middle -->
  <rect x="1068" y="360" width="392" height="104" class="blue"/>
  <text x="1093" y="386" class="small">MIDDLE</text>
  <text x="1264" y="394" text-anchor="middle" class="head">Planner / Lean tree manager</text>
  <text x="1264" y="421" text-anchor="middle" class="body">retrieve domain memory · maintain Lean tree / proof DAG</text>
  <text x="1264" y="447" text-anchor="middle" class="body">decompose the route · assign only ready leaves</text>
  <path d="M1264 464 L1264 486" class="green-arrow"/>

  <!-- memory stack -->
  <rect x="970" y="347" width="86" height="190" class="dash"/>
  <text x="1013" y="372" text-anchor="middle" class="tiny">DOMAIN</text><text x="1013" y="388" text-anchor="middle" class="tiny">MEMORY</text>
  <rect x="981" y="402" width="64" height="27" class="blue"/><text x="1013" y="420" text-anchor="middle" class="tiny">QClib</text>
  <rect x="981" y="437" width="64" height="27" class="gold"/><text x="1013" y="455" text-anchor="middle" class="tiny">textbook</text>
  <rect x="981" y="472" width="64" height="27" class="green"/><text x="1013" y="490" text-anchor="middle" class="tiny">paper map</text>
  <rect x="981" y="507" width="64" height="27" class="purple"/><text x="1013" y="525" text-anchor="middle" class="tiny">memory cards</text>
  <path d="M1056 433 L1065 433" class="green-arrow"/>

  <!-- Lower workers -->
  <text x="1264" y="510" text-anchor="middle" class="small">LOWER — focused workers receive one local obligation</text>
  <rect x="1082" y="528" width="112" height="100" class="green"/>
  <text x="1138" y="557" text-anchor="middle" class="body">NL proof</text><text x="1138" y="581" text-anchor="middle" class="body">worker</text><text x="1138" y="608" text-anchor="middle" class="tiny">one local argument</text>
  <rect x="1208" y="528" width="112" height="100" class="blue"/>
  <text x="1264" y="557" text-anchor="middle" class="body">Lean leaf</text><text x="1264" y="581" text-anchor="middle" class="body">worker</text><text x="1264" y="608" text-anchor="middle" class="tiny">one declaration</text>
  <rect x="1334" y="528" width="112" height="100" class="purple"/>
  <text x="1390" y="557" text-anchor="middle" class="body">Finite check</text><text x="1390" y="581" text-anchor="middle" class="body">worker</text><text x="1390" y="608" text-anchor="middle" class="tiny">one diagnostic</text>
  <path d="M1264 486 L1138 518" class="green-arrow"/><path d="M1264 486 L1264 518" class="green-arrow"/><path d="M1264 486 L1390 518" class="green-arrow"/>

  <!-- Reviewer -->
  <rect x="1085" y="650" width="358" height="92" class="gold"/>
  <text x="1264" y="679" text-anchor="middle" class="head">Reviewer / verifier agent</text>
  <text x="1264" y="705" text-anchor="middle" class="body">check obligations · evidence class · finite screens</text>
  <text x="1264" y="728" text-anchor="middle" class="small">return typed feedback; prevent target drift and unsupported promotion</text>
  <path d="M1138 628 L1185 642" class="green-arrow"/><path d="M1264 628 L1264 642" class="green-arrow"/><path d="M1390 628 L1343 642" class="green-arrow"/>
  <path d="M1085 696 C1048 696 1045 446 1060 414" class="orange-arrow"/>

  <!-- outputs -->
  <rect x="985" y="760" width="560" height="68" class="dash"/>
  <rect x="1001" y="771" width="165" height="46" class="green"/><text x="1083" y="800" text-anchor="middle" class="body">Construction</text>
  <rect x="1182" y="771" width="165" height="46" class="blue"/><text x="1264" y="800" text-anchor="middle" class="body">Lean theorem</text>
  <rect x="1363" y="771" width="165" height="46" class="purple"/><text x="1445" y="800" text-anchor="middle" class="body">Qiskit / OpenQASM</text>
  <path d="M1264 742 L1264 752" class="green-arrow"/>
  <text x="1264" y="847" text-anchor="middle" class="small">specialized roles + a maintained proof tree + reviewer feedback keep search disciplined</text>

  <text x="800" y="882" text-anchor="middle" class="subtitle">QuantumComputinglib, the textbook, paper maps, and certified memory cards act as domain preparation for the harness rather than as decorative documentation.</text>
</svg>
