<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Three-layer agent stack</title>
  <desc id="desc">Upper, middle, lower, and reviewer agents coordinate through shared files and trial logs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
  <text x="56" y="54" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Three-Layer Agent Stack</text>
  <text x="56" y="83" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Agents do not need a special chat server. They talk through files that are versioned, reviewable, and usable after an overnight run.</text>

  <rect x="80" y="125" width="960" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="112" y="154" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Upper agent</text>
  <text x="112" y="178" font-family="Inter,Arial,sans-serif" font-size="14" fill="#1e40af">Research director: chooses objective, compresses memory, rejects weak directions.</text>

  <rect x="80" y="220" width="960" height="70" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="112" y="249" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">Middle agent</text>
  <text x="112" y="273" font-family="Inter,Arial,sans-serif" font-size="14" fill="#115e59">Formalization maintainer: synchronizes LaTeX, Markdown, Lean names, and proof obligations.</text>

  <rect x="80" y="315" width="460" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="112" y="344" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Lower agent A</text>
  <text x="112" y="368" font-family="Inter,Arial,sans-serif" font-size="14" fill="#9a3412">Tries one circuit construction, lemma, resource count, or counterexample.</text>

  <rect x="580" y="315" width="460" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="612" y="344" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">Lower agent B</text>
  <text x="612" y="368" font-family="Inter,Arial,sans-serif" font-size="14" fill="#991b1b">Explores a different construction path with a disjoint write scope.</text>

  <rect x="80" y="410" width="960" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="112" y="441" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#334155">Reviewer agent</text>
  <text x="248" y="441" font-family="Inter,Arial,sans-serif" font-size="14" fill="#475569">checks Lean build, hidden oracle assumptions, citations, resource drift, and task status.</text>

  <path d="M560 195 V209" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M560 290 V304" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M310 385 V400" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M810 385 V400" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="820" y="22" width="220" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="842" y="47" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">runs/&lt;run-id&gt;/dialogue.md</text>
  <path d="M930 62 C950 100 970 120 1000 125" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="56" y="22" width="230" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="78" y="47" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">runs/trials.jsonl + summary.csv</text>
  <path d="M170 62 C150 105 130 115 100 125" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
