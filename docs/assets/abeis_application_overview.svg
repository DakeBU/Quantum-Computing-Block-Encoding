<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ASPBE application contracts</title>
  <desc id="desc">State preparation and block encoding as two separate mathematical contracts sharing one Lean certification boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#404040"/>
    </marker>
    <style>
      text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
      .title { font-size: 29px; font-weight: 700; }
      .head { font-size: 24px; font-weight: 700; }
      .formula { font-size: 28px; }
      .body { font-size: 18px; fill: #444; }
      .small { font-size: 16px; fill: #555; }
      .rule { stroke: #b6b6b6; stroke-width: 1.3; }
      .box { fill: #fff; stroke: #454545; stroke-width: 1.5; }
      .accent-state { stroke: #3d6b57; }
      .accent-block { stroke: #355c7d; }
      .arrow { stroke: #404040; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="title">Two mathematical targets, one proof boundary</text>
  <line x1="70" y1="66" x2="1130" y2="66" class="rule"/>

  <rect x="75" y="105" width="440" height="190" class="box accent-state"/>
  <text x="100" y="145" class="head">State Preparation</text>
  <text x="295" y="204" text-anchor="middle" class="formula">U |0ⁿ⟩ = |ψ⟩</text>
  <text x="100" y="246" class="body">Prove: target normalization · U unitary · state action</text>
  <text x="100" y="273" class="small">Interpretation: the first column of U is the target state.</text>

  <rect x="685" y="105" width="440" height="190" class="box accent-block"/>
  <text x="710" y="145" class="head">Block Encoding</text>
  <text x="905" y="198" text-anchor="middle" class="formula">‖A − α Π U Π†‖ ≤ ε</text>
  <text x="710" y="235" class="body">Prove: register layout · U unitary · clean block · error</text>
  <text x="710" y="262" class="small">Exact case: ε = 0.  The normalization α is part of the contract.</text>

  <path d="M520 200 L675 200" class="arrow"/>
  <text x="598" y="181" text-anchor="middle" class="small">prepared states may supply</text>
  <text x="598" y="222" text-anchor="middle" class="small">PREPARE primitives</text>

  <line x1="70" y1="328" x2="1130" y2="328" class="rule"/>
  <text x="95" y="365" class="body">Input:</text>
  <text x="150" y="365" class="body">state/operator + available query oracles + register conventions + α, ε + resource priorities</text>
  <text x="95" y="398" class="body">Output:</text>
  <text x="158" y="398" class="body">construction + human proof + named Lean root + optional Qiskit / OpenQASM artifacts</text>
</svg>
