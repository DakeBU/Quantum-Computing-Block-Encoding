<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#25313c"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #17232d; }
      .section { font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #17232d; }
      .label { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #25313c; }
      .body { font-family: Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #42515d; }
      .formula { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; font-weight: 500; fill: #17232d; }
      .small { font-family: Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #586773; }
      .box { fill: #ffffff; stroke-width: 2.5; rx: 6; }
      .arrow { fill: none; stroke: #25313c; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="760" fill="#ffffff"/>
  <text x="900" y="58" text-anchor="middle" class="title">Two quantum construction targets, one certification boundary</text>
  <line x1="70" y1="82" x2="1730" y2="82" stroke="#d7dee3" stroke-width="2"/>

  <rect x="70" y="125" width="500" height="490" class="box" stroke="#18865b"/>
  <rect x="70" y="125" width="500" height="68" fill="#e7f5ed"/>
  <text x="105" y="169" class="section">1  State preparation</text>
  <text x="105" y="230" class="body">Concrete entry point</text>

  <rect x="112" y="275" width="118" height="72" class="box" stroke="#7b8790"/>
  <text x="171" y="319" text-anchor="middle" class="formula">|0^n&gt;</text>
  <path d="M236 311 H314" class="arrow"/>
  <rect x="320" y="275" width="92" height="72" class="box" stroke="#18865b"/>
  <text x="366" y="319" text-anchor="middle" class="formula">U</text>
  <path d="M418 311 H476" class="arrow"/>
  <text x="506" y="319" text-anchor="middle" class="formula">|psi&gt;</text>

  <text x="105" y="405" class="label">Acceptance predicate</text>
  <text x="105" y="445" class="formula">U |0^n&gt; = |psi&gt;</text>
  <text x="105" y="486" class="body">Equivalent invariant: column 0 of U is |psi&gt;.</text>
  <text x="105" y="529" class="body">The target must be normalized.</text>
  <rect x="105" y="557" width="410" height="34" fill="#e7f5ed" rx="4"/>
  <text x="310" y="580" text-anchor="middle" class="small">Reusable later as a PREPARE primitive</text>

  <rect x="650" y="125" width="500" height="490" class="box" stroke="#b7791f"/>
  <rect x="650" y="125" width="500" height="68" fill="#fff4d6"/>
  <text x="685" y="169" class="section">Shared certified workflow</text>

  <rect x="700" y="233" width="400" height="62" class="box" stroke="#7b8790"/>
  <text x="900" y="272" text-anchor="middle" class="label">Fixed target and error contract</text>
  <path d="M900 302 V338" class="arrow"/>
  <rect x="700" y="345" width="400" height="62" class="box" stroke="#2563eb"/>
  <text x="900" y="384" text-anchor="middle" class="label">Candidate circuit + proof DAG</text>
  <path d="M900 414 V450" class="arrow"/>
  <rect x="700" y="457" width="400" height="62" class="box" stroke="#c43d3d"/>
  <text x="900" y="496" text-anchor="middle" class="label">Lean unitarity + semantic gate</text>
  <path d="M900 526 V562" class="arrow"/>
  <rect x="700" y="569" width="400" height="62" class="box" stroke="#18865b"/>
  <text x="900" y="595" text-anchor="middle" class="label">Certified population</text>
  <text x="900" y="617" text-anchor="middle" class="small">resource rank, then Qiskit/QASM export</text>

  <rect x="1230" y="125" width="500" height="490" class="box" stroke="#2563eb"/>
  <rect x="1230" y="125" width="500" height="68" fill="#e9f1ff"/>
  <text x="1265" y="169" class="section">2  Block encoding</text>
  <text x="1265" y="230" class="body">General operator embedding</text>

  <rect x="1280" y="270" width="112" height="78" class="box" stroke="#7b8790"/>
  <text x="1336" y="318" text-anchor="middle" class="formula">A</text>
  <path d="M1400 309 H1460" class="arrow"/>
  <rect x="1460" y="260" width="228" height="98" class="box" stroke="#2563eb"/>
  <rect x="1482" y="281" width="104" height="44" fill="#e9f1ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1534" y="311" text-anchor="middle" class="formula">A/alpha</text>
  <text x="1640" y="318" text-anchor="middle" class="formula">U_A</text>

  <text x="1265" y="405" class="label">Acceptance predicate</text>
  <text x="1265" y="445" class="formula">|| A - alpha P U_A P || &lt;= epsilon</text>
  <text x="1265" y="486" class="body">P selects the declared clean ancilla block.</text>
  <text x="1265" y="529" class="body">Register order, norm, and alpha stay fixed.</text>
  <rect x="1265" y="557" width="410" height="34" fill="#e9f1ff" rx="4"/>
  <text x="1470" y="580" text-anchor="middle" class="small">Exact first; relax epsilon one adjacent rung</text>

  <path d="M570 365 H642" class="arrow"/>
  <path d="M1150 365 H1222" class="arrow"/>
  <path d="M515 574 C600 700, 1200 700, 1265 574" fill="none" stroke="#18865b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="900" y="712" text-anchor="middle" class="label">A certified state-preparation module can feed a downstream block-encoding proof</text>
</svg>
