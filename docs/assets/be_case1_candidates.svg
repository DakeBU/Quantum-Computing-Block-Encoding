<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">BE Case 1 certified candidate sequence</title>
  <desc id="desc">Three expanded logical candidates for the transfer operator improve from six gates and depth five to four gates and depth two.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
    <style>
      text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
      .title { font-size: 28px; font-weight: 700; }
      .formula { font-size: 22px; }
      .head { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; fill: #444; }
      .score { font-size: 20px; font-weight: 700; }
      .box { fill: #fff; stroke: #555; stroke-width: 1.3; }
      .winner { stroke: #3d6b57; stroke-width: 2.2; }
      .arrow { stroke: #444; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .wire { stroke: #555; stroke-width: 1.2; }
      .gate { fill: #fff; stroke: #555; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1200" height="390" fill="#fff"/>
  <text x="600" y="40" text-anchor="middle" class="title">BE Case 1 — certified frontier in one logical circuit tier</text>
  <text x="600" y="75" text-anchor="middle" class="formula">E₁ = |0⟩⟨1|time ⊗ |0⟩⟨1|type ⊗ I₂,   ⟨0|ₐ U |0⟩ₐ = E₁</text>

  <rect x="65" y="112" width="290" height="205" class="box"/>
  <text x="210" y="145" text-anchor="middle" class="head">Depth-5 completion</text>
  <text x="210" y="174" text-anchor="middle" class="score">(6, 5, 1, 0)</text>
  <line x1="105" y1="214" x2="315" y2="214" class="wire"/>
  <line x1="105" y1="248" x2="315" y2="248" class="wire"/>
  <line x1="105" y1="282" x2="315" y2="282" class="wire"/>
  <rect x="137" y="202" width="30" height="24" class="gate"/><text x="152" y="220" text-anchor="middle" class="body">X</text>
  <rect x="190" y="236" width="36" height="24" class="gate"/><text x="208" y="254" text-anchor="middle" class="body">CX</text>
  <rect x="249" y="270" width="36" height="24" class="gate"/><text x="267" y="288" text-anchor="middle" class="body">CX</text>
  <text x="210" y="306" text-anchor="middle" class="body">Lean-certified exact block</text>

  <rect x="455" y="112" width="290" height="205" class="box"/>
  <text x="600" y="145" text-anchor="middle" class="head">Equality-transfer route</text>
  <text x="600" y="174" text-anchor="middle" class="score">(4, 4, 1, 0)</text>
  <line x1="495" y1="214" x2="705" y2="214" class="wire"/>
  <line x1="495" y1="248" x2="705" y2="248" class="wire"/>
  <line x1="495" y1="282" x2="705" y2="282" class="wire"/>
  <circle cx="545" cy="248" r="5" fill="#555"/><circle cx="545" cy="282" r="5" fill="#555"/>
  <line x1="545" y1="214" x2="545" y2="282" class="wire"/>
  <rect x="530" y="202" width="30" height="24" class="gate"/><text x="545" y="220" text-anchor="middle" class="body">X</text>
  <rect x="625" y="236" width="30" height="24" class="gate"/><text x="640" y="254" text-anchor="middle" class="body">X</text>
  <rect x="665" y="270" width="30" height="24" class="gate"/><text x="680" y="288" text-anchor="middle" class="body">X</text>
  <text x="600" y="306" text-anchor="middle" class="body">same target, fewer gates</text>

  <rect x="845" y="112" width="290" height="205" class="box winner"/>
  <text x="990" y="145" text-anchor="middle" class="head">Parallel equality-flip</text>
  <text x="990" y="174" text-anchor="middle" class="score">(4, 2, 1, 0)</text>
  <line x1="885" y1="214" x2="1095" y2="214" class="wire"/>
  <line x1="885" y1="248" x2="1095" y2="248" class="wire"/>
  <line x1="885" y1="282" x2="1095" y2="282" class="wire"/>
  <circle cx="930" cy="248" r="5" fill="#555"/><circle cx="930" cy="282" r="5" fill="#555"/>
  <line x1="930" y1="214" x2="930" y2="282" class="wire"/>
  <rect x="915" y="202" width="30" height="24" class="gate"/><text x="930" y="220" text-anchor="middle" class="body">X</text>
  <rect x="1010" y="202" width="30" height="24" class="gate"/><text x="1025" y="220" text-anchor="middle" class="body">X</text>
  <rect x="1010" y="236" width="30" height="24" class="gate"/><text x="1025" y="254" text-anchor="middle" class="body">X</text>
  <rect x="1010" y="270" width="30" height="24" class="gate"/><text x="1025" y="288" text-anchor="middle" class="body">X</text>
  <text x="990" y="306" text-anchor="middle" class="body">three independent flips share one layer</text>

  <path d="M365 214 L445 214" class="arrow"/>
  <path d="M755 214 L835 214" class="arrow"/>
  <text x="600" y="356" text-anchor="middle" class="body">Comparison is only within the expanded logical tier; the opaque one-call oracle seed is a different abstraction tier.</text>
</svg>
