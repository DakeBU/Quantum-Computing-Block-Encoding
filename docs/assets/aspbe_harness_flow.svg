<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="470" viewBox="0 0 1480 470" role="img" aria-labelledby="title desc">
  <title id="title">ASPBE contract-to-certificate workflow</title>
  <desc id="desc">A fixed mathematical contract is matched with proved components, turned into a candidate construction, screened, proved in Lean, and exported. Failed proof leaves return a typed obstruction to the construction stage.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3f3f3f"/></marker>
  </defs>
  <style>
    text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #555; }
    .num { font-size: 15px; font-weight: 700; fill: #666; }
    .head { font-size: 21px; font-weight: 700; }
    .body { font-size: 16px; fill: #444; }
    .small { font-size: 15px; fill: #5a5a5a; }
    .box { fill: #fff; stroke: #555; stroke-width: 1.4; }
    .lean { stroke: #466b5a; stroke-width: 2.2; }
    .screen { stroke: #78684b; stroke-width: 1.8; }
    .feedback { fill: #fff; stroke: #8a5d52; stroke-width: 1.6; }
    .arrow { stroke: #3f3f3f; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .feedback-arrow { stroke: #8a5d52; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .rule { stroke: #d1d1d1; stroke-width: 1.1; }
  </style>
  <rect width="1480" height="470" fill="#fff"/>
  <text x="740" y="50" text-anchor="middle" class="title">ASPBE — from a mathematical contract to checked evidence</text>
  <text x="740" y="82" text-anchor="middle" class="subtitle">The public workflow stays small; detailed controller state is stored separately for reproducibility.</text>

  <rect x="45" y="135" width="195" height="145" class="box"/>
  <text x="70" y="164" class="num">01</text>
  <text x="142" y="190" text-anchor="middle" class="head">Freeze contract</text>
  <text x="142" y="220" text-anchor="middle" class="body">target + conventions</text>
  <text x="142" y="246" text-anchor="middle" class="body">oracles + α, ε + costs</text>

  <rect x="285" y="135" width="195" height="145" class="box"/>
  <text x="310" y="164" class="num">02</text>
  <text x="382" y="190" text-anchor="middle" class="head">Retrieve</text>
  <text x="382" y="220" text-anchor="middle" class="body">compiled lemmas</text>
  <text x="382" y="246" text-anchor="middle" class="body">routes + obstructions</text>

  <rect x="525" y="135" width="195" height="145" class="box"/>
  <text x="550" y="164" class="num">03</text>
  <text x="622" y="190" text-anchor="middle" class="head">Construct</text>
  <text x="622" y="220" text-anchor="middle" class="body">one candidate route</text>
  <text x="622" y="246" text-anchor="middle" class="body">one ready proof leaf</text>

  <rect x="765" y="135" width="195" height="145" class="box screen"/>
  <text x="790" y="164" class="num">04</text>
  <text x="862" y="190" text-anchor="middle" class="head">Finite screen</text>
  <text x="862" y="220" text-anchor="middle" class="body">dimensions · entries</text>
  <text x="862" y="246" text-anchor="middle" class="body">unitarity · circuit checks</text>

  <rect x="1005" y="135" width="195" height="145" class="box lean"/>
  <text x="1030" y="164" class="num">05</text>
  <text x="1102" y="190" text-anchor="middle" class="head">Lean certificate</text>
  <text x="1102" y="220" text-anchor="middle" class="body">close named theorem</text>
  <text x="1102" y="246" text-anchor="middle" class="body">semantic proof authority</text>

  <rect x="1245" y="135" width="190" height="145" class="box"/>
  <text x="1270" y="164" class="num">06</text>
  <text x="1340" y="190" text-anchor="middle" class="head">Deliver</text>
  <text x="1340" y="220" text-anchor="middle" class="body">human proof + Lean</text>
  <text x="1340" y="246" text-anchor="middle" class="body">Qiskit / OpenQASM</text>

  <path d="M240 208 L275 208" class="arrow"/>
  <path d="M480 208 L515 208" class="arrow"/>
  <path d="M720 208 L755 208" class="arrow"/>
  <path d="M960 208 L995 208" class="arrow"/>
  <path d="M1200 208 L1235 208" class="arrow"/>

  <rect x="605" y="340" width="515" height="78" class="feedback"/>
  <text x="862" y="370" text-anchor="middle" class="head">Typed obstruction / failed proof leaf</text>
  <text x="862" y="397" text-anchor="middle" class="body">record the exact failure, then change the route, prerequisite, or declared tolerance rung</text>
  <path d="M1102 280 L1102 330 L1060 330" class="feedback-arrow"/>
  <path d="M605 379 L500 379 L500 300 L622 300 L622 290" class="feedback-arrow"/>

  <line x1="70" y1="445" x2="1410" y2="445" class="rule"/>
  <text x="740" y="464" text-anchor="middle" class="small">Finite checks may reject or prioritize a candidate; only the named Lean theorem certifies the advertised mathematical statement.</text>
</svg>
