<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">ASPBE contract-to-certificate flow</title>
  <desc id="desc">A fixed state-preparation or block-encoding contract passes through retrieval, construction, diagnostics, a named Lean theorem, and optional executable export.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
    <style>
      text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
      .title { font-size: 28px; font-weight: 700; }
      .stage { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; fill: #484848; }
      .box { fill: #fff; stroke: #555; stroke-width: 1.35; }
      .lean { stroke: #3d6b57; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .note { font-size: 15px; fill: #555; }
    </style>
  </defs>
  <rect width="1200" height="320" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="title">From a quantum contract to checked evidence</text>

  <rect x="45" y="92" width="180" height="105" class="box"/>
  <text x="135" y="126" text-anchor="middle" class="stage">1. Contract</text>
  <text x="135" y="154" text-anchor="middle" class="body">state or operator</text>
  <text x="135" y="177" text-anchor="middle" class="body">oracles · registers · α · ε</text>

  <rect x="280" y="92" width="180" height="105" class="box"/>
  <text x="370" y="126" text-anchor="middle" class="stage">2. Retrieve</text>
  <text x="370" y="154" text-anchor="middle" class="body">proved components</text>
  <text x="370" y="177" text-anchor="middle" class="body">routes and obstructions</text>

  <rect x="515" y="92" width="180" height="105" class="box"/>
  <text x="605" y="126" text-anchor="middle" class="stage">3. Construct</text>
  <text x="605" y="154" text-anchor="middle" class="body">one candidate route</text>
  <text x="605" y="177" text-anchor="middle" class="body">one ready proof leaf</text>

  <rect x="750" y="92" width="180" height="105" class="box lean"/>
  <text x="840" y="126" text-anchor="middle" class="stage">4. Lean gate</text>
  <text x="840" y="154" text-anchor="middle" class="body">unitarity + semantics</text>
  <text x="840" y="177" text-anchor="middle" class="body">named theorem root</text>

  <rect x="985" y="92" width="170" height="105" class="box"/>
  <text x="1070" y="126" text-anchor="middle" class="stage">5. Export</text>
  <text x="1070" y="154" text-anchor="middle" class="body">human proof</text>
  <text x="1070" y="177" text-anchor="middle" class="body">Qiskit · OpenQASM</text>

  <path d="M225 145 L270 145" class="arrow"/>
  <path d="M460 145 L505 145" class="arrow"/>
  <path d="M695 145 L740 145" class="arrow"/>
  <path d="M930 145 L975 145" class="arrow"/>

  <line x1="85" y1="237" x2="1115" y2="237" stroke="#bbb" stroke-width="1"/>
  <text x="600" y="268" text-anchor="middle" class="note">Finite diagnostics may reject a bad candidate before Lean; they do not certify a symbolic family.</text>
  <text x="600" y="294" text-anchor="middle" class="note">A failed route becomes typed memory. Repeating the same leaf against unchanged evidence is not progress.</text>
</svg>
