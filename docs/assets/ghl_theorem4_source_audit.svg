<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GHL Theorem 4 source-audited composition</title>
  <desc id="desc">One-term operators assemble into A and its adjoint, then into S1 and S2, and finally the one-dimensional Hamiltonian. The first printed S1 phase pair has a proved filler obstruction; the phase-balanced correction closes S1.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
    <style>
      text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
      .title { font-size: 28px; font-weight: 700; }
      .head { font-size: 20px; font-weight: 700; }
      .formula { font-size: 21px; }
      .formula-sub { font-size: 15px; }
      .body { font-size: 16px; fill: #444; }
      .small { font-size: 15px; fill: #555; }
      .box { fill: #fff; stroke: #555; stroke-width: 1.3; }
      .closed { stroke: #3d6b57; stroke-width: 2; }
      .audit { stroke: #8a5a4a; stroke-width: 1.7; }
      .arrow { stroke: #444; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#fff"/>
  <text x="600" y="40" text-anchor="middle" class="title">GHL Theorem 4 — source-audited composition</text>

  <rect x="55" y="105" width="205" height="100" class="box"/>
  <text x="157" y="140" text-anchor="middle" class="head">One-term source blocks</text>
  <text x="157" y="171" text-anchor="middle" class="formula">Aₖ ,  Aₖ†</text>
  <text x="157" y="193" text-anchor="middle" class="small">Theorem-3 source-oracle boundary</text>

  <rect x="320" y="105" width="205" height="100" class="box closed"/>
  <text x="422" y="140" text-anchor="middle" class="head">Finite sums</text>
  <text x="422" y="171" text-anchor="middle" class="formula">A = Σₖ Aₖ</text>
  <text x="422" y="195" text-anchor="middle" class="formula">A† = Σₖ Aₖ†</text>

  <rect x="585" y="78" width="230" height="154" class="box audit"/>
  <text x="700" y="114" text-anchor="middle" class="head">LCU to S₁ and S₂</text>
  <text x="700" y="147" text-anchor="middle" class="body">printed S₁ phase pair:</text>
  <text x="700" y="171" text-anchor="middle" class="body">proved nonzero filler</text>
  <text x="700" y="197" text-anchor="middle" class="body">phase-balanced S₁: exact</text>
  <text x="700" y="220" text-anchor="middle" class="body">printed S₂: exact</text>

  <rect x="875" y="105" width="270" height="100" class="box closed"/>
  <text x="1010" y="140" text-anchor="middle" class="head">Hamiltonian</text>
  <text x="1010" y="176" text-anchor="middle" class="formula"><tspan>H = S₁ ⊗ x</tspan><tspan class="formula-sub" baseline-shift="sub">ξ</tspan><tspan> + S₂ ⊗ I</tspan><tspan class="formula-sub" baseline-shift="sub">ξ</tspan></text>
  <text x="1010" y="198" text-anchor="middle" class="small">normalization · layout · resources closed</text>

  <path d="M260 155 L310 155" class="arrow"/>
  <path d="M525 155 L575 155" class="arrow"/>
  <path d="M815 155 L865 155" class="arrow"/>

  <line x1="55" y1="268" x2="1145" y2="268" stroke="#bbb" stroke-width="1"/>
  <text x="75" y="300" class="body">Closed:</text>
  <text x="135" y="300" class="body">source-audited Theorem-4 A → S₁,S₂ → H composition.</text>
  <text x="75" y="329" class="body">Open:</text>
  <text x="125" y="329" class="body">uniform arbitrary-width primitive compilation/resource theorem for all Theorem-3 source oracles.</text>
</svg>
