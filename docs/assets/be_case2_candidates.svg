<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">BE Case 2 exact Householder routes</title>
  <desc id="desc">Cold and hinted routes for the cubic diagonal operator converge to the same exact rational Householder block encoding.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
    <style>
      text { font-family: "Times New Roman", Times, "Liberation Serif", serif; fill: #171717; }
      .title { font-size: 28px; font-weight: 700; }
      .formula { font-size: 22px; }
      .head { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; fill: #444; }
      .small { font-size: 15px; fill: #555; }
      .box { fill: #fff; stroke: #555; stroke-width: 1.3; }
      .root { stroke: #3d6b57; stroke-width: 2.1; }
      .arrow { stroke: #444; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="1200" height="390" fill="#fff"/>
  <text x="600" y="40" text-anchor="middle" class="title">BE Case 2 — cubic diagonal operator</text>
  <text x="600" y="75" text-anchor="middle" class="formula">Dₙ = diag₀≤ⱼ&lt;₂ⁿ ((j / 2ⁿ)³),   Π Uₙ Π† = Dₙ,   α = 1</text>

  <text x="105" y="122" class="head">Cold route</text>
  <rect x="85" y="145" width="280" height="105" class="box"/>
  <text x="225" y="177" text-anchor="middle" class="head">Direct cubic completion</text>
  <text x="225" y="206" text-anchor="middle" class="body">N⁶ − j⁶ = s₁² + s₂² + s₃² + s₄²</text>
  <text x="225" y="232" text-anchor="middle" class="small">build vⱼ with first coordinate (j/N)³</text>

  <text x="500" y="122" class="head">Hinted route</text>
  <rect x="480" y="145" width="280" height="105" class="box"/>
  <text x="620" y="177" text-anchor="middle" class="head">Linear supplier first</text>
  <text x="620" y="206" text-anchor="middle" class="body">O₀ = diag(j/N),   Dₙ = O₀³</text>
  <text x="620" y="232" text-anchor="middle" class="small">reuse the exact linear Householder block</text>

  <rect x="855" y="128" width="275" height="138" class="box root"/>
  <text x="992" y="164" text-anchor="middle" class="head">Exact cubic Householder root</text>
  <text x="992" y="198" text-anchor="middle" class="body">H(vⱼ)₀₀ = (j/N)³</text>
  <text x="992" y="224" text-anchor="middle" class="body">⊕ⱼ H(vⱼ) is orthogonal</text>
  <text x="992" y="250" text-anchor="middle" class="small">named Lean contract closes Dₙ exactly</text>

  <path d="M365 197 L845 197" class="arrow"/>
  <path d="M760 197 L845 197" class="arrow"/>
  <text x="600" y="292" text-anchor="middle" class="body">The identity Dₙ = O₀³ is useful route information; QSVT is not required for correctness once the direct exact root is closed.</text>

  <line x1="85" y1="322" x2="1130" y2="322" stroke="#bbb" stroke-width="1"/>
  <text x="600" y="351" text-anchor="middle" class="small">Finite Qiskit / OpenQASM instances validate exported implementations. They are not the proof of the arbitrary-n symbolic family.</text>
</svg>
