<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Human expert reasoning, LLM-only reasoning, and the current ASPBE proof-gated synthesis loop</title>
  <desc id="desc">A comic-style comparison. Human expert reasoning derives State Preparation and Block Encoding manually. LLM-only reasoning produces plausible but unverified drafts. The current ASPBE system freezes a formal contract, reuses formal memory and a theorem graph, lets a Frontier Master coordinate parallel generalist Workers, applies hard acceptance gates, routes typed feedback, and emits certified outputs.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#356f94"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#36805a"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b45a67"/></marker>
