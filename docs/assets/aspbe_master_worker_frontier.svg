  <text class="title" x="900" y="58" text-anchor="middle">From plausible construction to certified quantum artifact</text>
  <text class="subtitle" x="900" y="92" text-anchor="middle">The mathematics is the same; reusable formal memory and proof gates change how the result is produced.</text>

