      .card { stroke-width: 1.8; rx: 16; ry: 16; }
      .blueArrow { stroke: #356f94; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .greenArrow { stroke: #36805a; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .redArrow { stroke: #b45a67; stroke-width: 2.8; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowRed); }
    </style>
