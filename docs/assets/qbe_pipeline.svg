<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">QBE automation pipeline</title>
  <desc id="desc">Pipeline from paper or open problem to Lean checked block encoding certificate.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1120" height="430" fill="#f8fafc"/>
  <text x="56" y="54" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Quantum Block-Encoding Automation Pipeline</text>
  <text x="56" y="84" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">The project does not stop at an assumed oracle. It searches for a concrete circuit matrix and checks the claim in Lean.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="128" width="168" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="82" y="164" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Paper or Gap</text>
    <text x="82" y="193" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">arXiv, theorem,</text>
    <text x="82" y="212" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">assumed oracle</text>

    <rect x="280" y="128" width="168" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="306" y="164" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Formal Spec</text>
    <text x="306" y="193" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">operator, block,</text>
    <text x="306" y="212" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">normalizer</text>

    <rect x="504" y="128" width="168" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="530" y="164" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Circuit Search</text>
    <text x="530" y="193" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">gates, ancillas,</text>
    <text x="530" y="212" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">resource counts</text>

    <rect x="728" y="128" width="168" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="754" y="164" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Lean Gate</text>
    <text x="754" y="193" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">lake build</text>
    <text x="754" y="212" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">lake build Tests</text>

    <rect x="952" y="128" width="112" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="978" y="164" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Review</text>
    <text x="978" y="193" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">docs and</text>
    <text x="978" y="212" font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">registry</text>
  </g>

  <path d="M224 184 H268" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M448 184 H492" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M672 184 H716" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M896 184 H940" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1008 248 C1008 340 150 340 140 248" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="365" y="365" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f766e">failed or incomplete proof becomes a new trial, proof obligation, or open problem</text>

  <rect x="56" y="286" width="235" height="44" rx="7" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="74" y="313" font-family="Inter,Arial,sans-serif" font-size="14" fill="#155e75">Source: literature registry with clickable links</text>
  <rect x="800" y="286" width="264" height="44" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="818" y="313" font-family="Inter,Arial,sans-serif" font-size="14" fill="#166534">Only compiled claims are treated as closed</text>
</svg>
